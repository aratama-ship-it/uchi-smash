      }
    } else if (ev.type === "mob-hit") {
      fx.shake = 10;
      for (let k = 0; k < 12; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() * 6 + 2) * ev.dir + (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.7) * 8,
          life: 16 + Math.random() * 8, size: 3 + Math.random() * 3, color: "#fff",
        });
      }
    } else if (ev.type === "lava-hit") {
      fx.shake = 8;
      for (let k = 0; k < 14; k++) {
        fx.particles.push({ x: ev.x, y: ev.y, vx: (Math.random() - 0.5) * 7, vy: -(Math.random() * 7 + 2), life: 16 + Math.random() * 10, size: 2 + Math.random() * 3, color: Math.random() < 0.5 ? "#ff7a2a" : "#ffd34d" });
      }
    } else if (ev.type === "warp") {
      for (let k = 0; k < 14; k++) {
        const ang = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 5;
        fx.particles.push({ x: ev.x, y: ev.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 14 + Math.random() * 8, size: 2 + Math.random() * 2, color: "#8fe3ff" });
      }
    } else if (ev.type === "bounce") {
      // トランポリンをビヨンと揺らす（床xで管理、時間経過で減衰振動）
      if (ev.px !== undefined) fx.tramp[Math.round(ev.px)] = 0;   // 0からアニメ開始
      for (let k = 0; k < 8; k++) {
        fx.particles.push({ x: ev.x + (Math.random() - 0.5) * 44, y: ev.y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4, life: 12 + Math.random() * 6, size: 2 + Math.random() * 2, color: "#ff9ec4" });
      }
    }
  }
}

function updateFx() {
  fx.shake *= 0.85;
  if (fx.koFlash > 0) fx.koFlash--;
  for (let i = fx.particles.length - 1; i >= 0; i--) {
    const pt = fx.particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += 0.3;
    pt.life--;
    if (pt.life <= 0) fx.particles.splice(i, 1);
  }
  // トランポリンのビヨン揺れ（経過フレームを進める。40超で終了）
  for (const k in fx.tramp) { fx.tramp[k]++; if (fx.tramp[k] > 40) delete fx.tramp[k]; }
  // 撃墜リング
  for (let i = fx.rings.length - 1; i >= 0; i--) { fx.rings[i].t++; if (fx.rings[i].t > 30) fx.rings.splice(i, 1); }
  if (fx.koLabel && --fx.koLabel.t <= 0) fx.koLabel = null;
}

// トランポリンの沈み量（ビヨンビヨン＝減衰する正弦振動）。t=経過フレーム
function trampDip(platX) {
  const t = fx.tramp[Math.round(platX)];
  if (t === undefined) return 0;
  return Math.sin(t * 0.5) * 16 * Math.exp(-t * 0.07);   // 最初に沈んで数回揺れて収束
}

/* ==================== 描画 ==================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function drawBackground(stage) {
  const th = (stage || STAGES[0]).theme;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(0.7, th.sky[1]);
  g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 遠景の山
  ctx.fillStyle = th.mountain;
  ctx.beginPath();
  ctx.moveTo(0, 620); ctx.lineTo(250, 380); ctx.lineTo(520, 600);
  ctx.lineTo(760, 340); ctx.lineTo(1060, 610); ctx.lineTo(1280, 460);
  ctx.lineTo(1280, 720); ctx.lineTo(0, 720);
  ctx.fill();
}

function drawStage(platforms, theme) {
  const th = theme;
  const now = performance.now();
  for (const plat of platforms) {
    if (plat.crumbleState === "gone") continue;   // 崩れて消えた床は描かない
    // 崩れかけは揺れる
    let sx = 0;
    if (plat.crumbleState === "crack") sx = Math.sin(now / 40 + plat.x) * 1.6;
    if (plat.main) {
      ctx.fillStyle = th.dirt;
      ctx.fillRect(plat.x, plat.y, plat.w, H - plat.y);
      ctx.fillStyle = th.grass;
      ctx.fillRect(plat.x, plat.y, plat.w, 14);
      ctx.fillStyle = th.grass2;
      ctx.fillRect(plat.x, plat.y + 14, plat.w, 5);
      // コンベアの矢印
      if (plat.conveyor) drawConveyorArrows(plat);
    } else if (plat.bounce) {
      // トランポリン: 中央が沈む膜（着地でビヨンビヨン揺れる）＋バネ
      const dip = trampDip(plat.x);           // 中央の沈み量（減衰振動）
      const cx = plat.x + plat.w / 2, midY = plat.y + Math.max(0, dip);
      // 枠（左右のポール）
      ctx.strokeStyle = "#8a2a52"; ctx.lineWidth = 5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(plat.x + 4, plat.y - 4); ctx.lineTo(plat.x + 4, plat.y + 22);
      ctx.moveTo(plat.x + plat.w - 4, plat.y - 4); ctx.lineTo(plat.x + plat.w - 4, plat.y + 22); ctx.stroke();
      // 膜（中央が dip ぶん下がる曲線）
      ctx.fillStyle = "#d84a86"; ctx.strokeStyle = "#ff9ec4"; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(plat.x + 4, plat.y);
      ctx.quadraticCurveTo(cx, plat.y + dip * 2, plat.x + plat.w - 4, plat.y);
      ctx.stroke();
      ctx.lineTo(plat.x + plat.w - 4, plat.y + 6);
      ctx.quadraticCurveTo(cx, plat.y + 6 + dip * 2, plat.x + 4, plat.y + 6);
      ctx.closePath(); ctx.fill();
      // バネ（沈み量ぶん縮む）
      ctx.strokeStyle = "#ffb8d4"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      const springTop = plat.y + 8, springBot = plat.y + 20 - Math.max(0, dip) * 0.4;
      for (let bx = plat.x + 12; bx < plat.x + plat.w - 8; bx += 16) { ctx.moveTo(bx, springTop); ctx.lineTo(bx + 8, springBot); ctx.lineTo(bx + 16, springTop); }
      ctx.stroke();
      ctx.lineCap = "butt";
    } else {
      const moving = plat.moveAxis !== undefined;
      const cracking = plat.crumbleState === "crack";
      ctx.save();
      ctx.translate(sx, 0);
      ctx.fillStyle = cracking ? "#b08a6a" : th.plat;
      ctx.fillRect(plat.x, plat.y, plat.w, moving || plat.crumble ? 14 : 12);
      ctx.fillStyle = th.platTop;
      ctx.fillRect(plat.x, plat.y, plat.w, 4);
      if (moving) { ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2; ctx.strokeRect(plat.x, plat.y, plat.w, 14); }
      if (cracking) {   // ヒビ
        ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(plat.x + plat.w * 0.35, plat.y); ctx.lineTo(plat.x + plat.w * 0.4, plat.y + 14);
        ctx.moveTo(plat.x + plat.w * 0.65, plat.y); ctx.lineTo(plat.x + plat.w * 0.6, plat.y + 14);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawConveyorArrows(plat) {
  const dir = plat.conveyor > 0 ? 1 : -1;
  ctx.strokeStyle = "rgba(255,220,80,0.85)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  const cy = plat.y + 8;
  for (let ax = plat.x + 30; ax < plat.x + plat.w - 20; ax += 60) {
    ctx.beginPath();
    ctx.moveTo(ax, cy); ctx.lineTo(ax + dir * 16, cy);
    ctx.moveTo(ax + dir * 16, cy); ctx.lineTo(ax + dir * 8, cy - 6);
    ctx.moveTo(ax + dir * 16, cy); ctx.lineTo(ax + dir * 8, cy + 6);
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}

// 溶岩ゾーン
// 奈落の縦穴（せり上がり溶岩ステージ）。中央の暗い深穴＋上昇直前の予告グロー
function drawPit(m) {
  const rl = m.risingLava, g = m.groundY;
  const grad = ctx.createLinearGradient(0, g - 10, 0, H);
  grad.addColorStop(0, "rgba(8,3,6,0.6)");
  grad.addColorStop(0.4, "rgba(4,1,3,0.92)");
  grad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = grad;
  ctx.fillRect(rl.x, g - 6, rl.w, H - g + 60);
  // 縁のハイライト（穴のフチ）
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(rl.x - 2, g - 6, 4, 10);
  ctx.fillRect(rl.x + rl.w - 2, g - 6, 4, 10);
  // 上昇直前(約1.2s)の予告: 穴の底が赤くうねる
  if (rl.phase === "down" && rl.timer < 72) {
    const now = performance.now();
    const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 70));
    ctx.fillStyle = `rgba(255,80,25,${a.toFixed(3)})`;
    for (let x = rl.x; x < rl.x + rl.w; x += 14) {
      const hh = 10 + Math.sin(now / 90 + x / 18) * 6;
      ctx.fillRect(x, H - 30 - hh, 10, hh + 30);
    }
  }
}

function drawLavaZones(lava) {
  const now = performance.now();
  for (const lv of lava) {
    ctx.fillStyle = "#d63a1e";
    ctx.fillRect(lv.x, lv.y, lv.w, lv.h);
    ctx.fillStyle = "#ff7a2a";
    ctx.beginPath();
    ctx.moveTo(lv.x, lv.y + 4);
    for (let x = lv.x; x <= lv.x + lv.w; x += 16) ctx.lineTo(x, lv.y + 3 + Math.sin(now / 200 + x / 20) * 3);
    ctx.lineTo(lv.x + lv.w, lv.y + 12); ctx.lineTo(lv.x, lv.y + 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,220,120,0.7)";
    for (let k = 0; k < lv.w; k += 40) { const bx = lv.x + 20 + k, by = lv.y + 8 + ((now / 6 + k * 7) % (lv.h - 10)); ctx.fillRect(bx, lv.y + lv.h - (by - lv.y) % lv.h, 3, 3); }
  }
}

// ワープ口。出現中は光る、消滅中は薄いゴースト＋もうすぐ出るとき点滅
function drawWarps(warps, warpOn, warpTimer) {
  const now = performance.now();
  const cols = ["#42d9ff", "#c86bff", "#ffd34d", "#3ee657"];
  const soon = !warpOn && warpTimer <= 45;          // もうすぐ出現（点滅で予告）
  const blink = soon ? (Math.floor(now / 120) % 2 === 0) : false;
  for (let i = 0; i < warps.length; i++) {
    const w = warps[i], c = cols[Math.floor(i / 2) % cols.length];
    const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
    ctx.save();
    if (warpOn) {
      ctx.strokeStyle = c; ctx.lineWidth = 3;
      for (let r = 0; r < 3; r++) {
        const rr = 1 - ((now / 700 + r / 3) % 1);
        ctx.globalAlpha = rr * 0.8;
        ctx.beginPath(); ctx.ellipse(cx, cy, (w.w / 2) * rr, (w.h / 2) * rr, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.strokeStyle = c; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(cx, cy, w.w / 2, w.h / 2, 0, 0, Math.PI * 2); ctx.stroke();
    } else {
      // 消滅中: 薄い破線のゴースト（予告点滅時は少し濃く）
      ctx.globalAlpha = blink ? 0.5 : 0.18;
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.ellipse(cx, cy, w.w / 2, w.h / 2, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

// 振り子（球）
function drawPendulums(pendulums) {
  for (const pd of pendulums) {
    ctx.strokeStyle = "rgba(220,220,235,0.7)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(pd.pivotX, pd.pivotY); ctx.lineTo(pd.x, pd.y); ctx.stroke();
    ctx.fillStyle = "#3f4550"; ctx.beginPath(); ctx.arc(pd.pivotX, pd.pivotY, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a3040"; ctx.strokeStyle = "#d0556a"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(pd.x, pd.y, pd.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.arc(pd.x - pd.r * 0.35, pd.y - pd.r * 0.35, pd.r * 0.28, 0, Math.PI * 2); ctx.fill();
  }
}

// 動く壁を描画（地面から上に出ている部分だけ。下がりきると見えない）
function drawWalls(walls, groundY, theme) {
  for (const w of walls) {
    if (w.top >= groundY) continue;   // 地面下＝隠れている
    const h = groundY - w.top;
    ctx.fillStyle = theme.wall || "#8a94a6";
    ctx.fillRect(w.x, w.top, w.w, h);
    ctx.fillStyle = theme.wallTop || "#c0ccdc";
    ctx.fillRect(w.x, w.top, w.w, 7);
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.top, w.w, h);
    // 上下の矢印ヒント
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("↕", w.x + w.w / 2, w.top - 6);
  }
}

// 静的ステージから壁のプレビュー用スナップショットを作る（ロビー用）
function wallSnapshot(stage, phase) {
  if (!stage.walls) return { walls: [], groundY: 585 };
  const mains = stage.platforms.filter(p => p.main);
  const g = mains.length ? Math.max(...mains.map(p => p.y)) : 585;
  const walls = stage.walls.map(w => {
    const raise = w.side === "left" ? phase : 1 - phase;
    return { x: w.x, w: w.w, top: g + 8 - (w.height + 8) * raise };
  });
  return { walls, groundY: g };
}

const ITEM_STYLE = {
  reach:  { color: "#ff8c42", dark: "#c85a1a", label: "リーチ" },
  speed:  { color: "#42d9ff", dark: "#1a8fc8", label: "スピード" },
  beam:   { color: "#c86bff", dark: "#8a2ad0", label: "ビーム" },
  refill: { color: "#ff7bb0", dark: "#c8407a", label: "風船満タン" },
  giant:  { color: "#f25a5a", dark: "#b52e2e", label: "巨大化" },
};

// アイテム本体を描画（落下中はふわっと揺れる）
function drawItem(it) {
  const st = ITEM_STYLE[it.type];
  const r = ITEM.radius;
  // 風船満タンアイテム: ふわふわ浮く風船の姿
  if (it.type === "refill") {
    const bob = Math.sin(performance.now() / 260 + it.x / 40) * 5;
    const cx = it.x, cy = it.y + bob;
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx, cy + 20); ctx.quadraticCurveTo(cx + 5, cy + 30, cx, cy + 40); ctx.stroke();
    ctx.shadowColor = st.color; ctx.shadowBlur = 12;
    ctx.fillStyle = st.color; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, 17, 21, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
    // 結び目
    ctx.fillStyle = st.color; ctx.beginPath(); ctx.moveTo(cx - 4, cy + 20); ctx.lineTo(cx + 4, cy + 20); ctx.lineTo(cx, cy + 25); ctx.closePath(); ctx.fill();
    // ハイライト＋「満」
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.ellipse(cx - 5, cy - 6, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("満", cx, cy + 1); ctx.textBaseline = "alphabetic";
    return;
  }
  const bob = it.landed ? Math.sin(performance.now() / 300 + it.x) * 3 : 0;
  const cx = it.x, cy = it.y + bob;
  // 光るカプセル
  ctx.save();
  ctx.shadowColor = st.color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = st.color;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  // アイコン（分かりやすく）
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  if (it.type === "reach") {
    // 波動リーチ: 発信源の点＋広がる同心の波
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx - 8, cy, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
    for (let r = 5; r <= 13; r += 4) {
      ctx.beginPath(); ctx.arc(cx - 8, cy, r, -0.9, 0.9); ctx.stroke();
    }
  } else if (it.type === "beam") {
    // ビーム: 太い光線＋根元の輝き
    ctx.fillStyle = "#fff";
    ctx.fillRect(cx - 11, cy - 3, 18, 6);
    ctx.beginPath();
    ctx.moveTo(cx + 7, cy - 7); ctx.lineTo(cx + 14, cy); ctx.lineTo(cx + 7, cy + 7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - 11, cy, 4, 0, Math.PI * 2); ctx.fill();
  } else if (it.type === "giant") {
    // 巨大化: 小さい四角→大きい四角＋外向き矢印
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
    ctx.strokeRect(cx - 3, cy - 3, 6, 6);
    ctx.strokeRect(cx - 10, cy - 10, 20, 20);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + 11, cy - 11); ctx.lineTo(cx + 15, cy - 15);
    ctx.moveTo(cx - 11, cy - 11); ctx.lineTo(cx - 15, cy - 15);
    ctx.moveTo(cx + 11, cy + 11); ctx.lineTo(cx + 15, cy + 15);
    ctx.moveTo(cx - 11, cy + 11); ctx.lineTo(cx - 15, cy + 15);
    ctx.stroke(); ctx.lineCap = "butt";
  } else {
    // スピード: 早送りの二重シェブロン >>
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy - 7); ctx.lineTo(cx - 1, cy); ctx.lineTo(cx - 8, cy + 7);
    ctx.moveTo(cx + 1, cy - 7); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx + 1, cy + 7);
    ctx.stroke();
    ctx.lineJoin = "miter"; ctx.lineCap = "butt";
  }
}

// ドスン風モブ（四角＋顔。上昇中は風船つき）
function drawMob(m) {
  if (!m) return;
  const s = MOB.size, x = m.x, y = m.y;
  // 風船（上昇中）
  if (m.state === "rise") {
    ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + s / 2, y); ctx.lineTo(x + s / 2, y - 24); ctx.stroke();
    ctx.fillStyle = "#ff5b7f"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x + s / 2, y - 34, 13, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // 本体（石っぽいグレー）
  ctx.fillStyle = "#6b7280";
  ctx.strokeStyle = "#3f4550"; ctx.lineWidth = 3;
  roundRect(x, y, s, s, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#565c66";
  roundRect(x + 4, y + 4, s - 8, s - 8, 4); ctx.fill();
  // 目（落下中は怒り目）
  ctx.fillStyle = "#fff";
  const ey = y + s * 0.42;
  ctx.beginPath();
  ctx.arc(x + s * 0.34, ey, 6, 0, Math.PI * 2);
  ctx.arc(x + s * 0.66, ey, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  const look = m.state === "fall" ? 2 : 0;
  ctx.beginPath();
  ctx.arc(x + s * 0.34, ey + look, 3, 0, Math.PI * 2);
  ctx.arc(x + s * 0.66, ey + look, 3, 0, Math.PI * 2);
  ctx.fill();
  // 口
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (m.state === "fall") { ctx.moveTo(x + s * 0.32, y + s * 0.72); ctx.lineTo(x + s * 0.68, y + s * 0.72); }
  else { ctx.arc(x + s / 2, y + s * 0.64, 6, 0.15, Math.PI - 0.15); }
  ctx.stroke();
}

function drawPlayer(p) {
  if (!p.alive) return;
  // 巨大化中は足元(p.x,p.y)を基準に拡大して描く
  const _gs = p.itemType === "giant" ? GIANT.size : 1;
  ctx.save();
  if (_gs !== 1) { ctx.translate(p.x, p.y); ctx.scale(_gs, _gs); ctx.translate(-p.x, -p.y); }
  const bx = p.x - PLAYER_W / 2;
  const by = p.y - PLAYER_H;

  // リスポーン無敵は点滅
  if (p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0 && p.invuln > 30) {
    ctx.globalAlpha = 0.35;
  }

  // 短い足（体より下に。地上を動いているときはちょこちょこ交互に動く）
  const legLen = 8, bodyH = PLAYER_H - legLen;
  const moving = p.onGround && Math.abs(p.vx) > 0.4;
  const legPhase = moving ? performance.now() * 0.022 : 0;   // 素早いちょこちょこ
  const legTop = by + bodyH - 3, footY = p.y;
  const legDefs = [
    { x: bx + PLAYER_W * 0.30, lift: moving ? Math.max(0, Math.sin(legPhase)) * 5 : 0 },
    { x: bx + PLAYER_W * 0.70, lift: moving ? Math.max(0, Math.sin(legPhase + Math.PI)) * 5 : 0 },
  ];
  ctx.fillStyle = COLORS_D[p.slot];
  for (const lg of legDefs) {
    const foot = footY - lg.lift;
    if (foot - legTop > 0.5) { roundRect(lg.x - 4, legTop, 8, foot - legTop, 3); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(lg.x, foot, 5, 3.2, 0, 0, Math.PI * 2); ctx.fill();   // 小さな足先
  }

  // 体（足の上に重ねて描く）
  ctx.fillStyle = p.hitFlash > 0 ? "#ffffff" : COLORS[p.slot];
  ctx.strokeStyle = COLORS_D[p.slot];
  ctx.lineWidth = 3;
  roundRect(bx, by, PLAYER_W, bodyH, 8);
  ctx.fill();
  ctx.stroke();

  // 目（向いてる方向）
  ctx.fillStyle = "#fff";
  const eyeX = p.x + p.facing * 6;
  ctx.beginPath();
  ctx.arc(eyeX - 4, by + 14, 4.5, 0, Math.PI * 2);
  ctx.arc(eyeX + 6, by + 14, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(eyeX - 4 + p.facing * 1.5, by + 14, 2, 0, Math.PI * 2);
  ctx.arc(eyeX + 6 + p.facing * 1.5, by + 14, 2, 0, Math.PI * 2);
  ctx.fill();

  // 攻撃スイング（通常/必殺で色・大きさ、reach延長、向き別 fwd/up/down）
  const atk = p.attackIsSpecial ? SPECIAL : ATTACK;
  if (p.attackTimer <= atk.activeFrom && p.attackTimer >= atk.activeTo && p.attackTimer > 0) {
    const prog = (atk.activeFrom - p.attackTimer) / (atk.activeFrom - atk.activeTo);
    if (p.itemType === "beam") {
      // ビーム: 長距離の光線を描く
      const len = ITEM.beamRange, th = ITEM.beamThick;
      ctx.save();
      ctx.globalAlpha = 0.85 - prog * 0.3;
      const grad = "#c86bff";
      if (p.attackDir === "up") {
        ctx.fillStyle = grad; ctx.fillRect(p.x - th / 2, p.y - PLAYER_H - len - 4, th, len);
        ctx.fillStyle = "#fff"; ctx.fillRect(p.x - th / 6, p.y - PLAYER_H - len - 4, th / 3, len);
      } else if (p.attackDir === "down") {
        ctx.fillStyle = grad; ctx.fillRect(p.x - th / 2, p.y + 4, th, len);
        ctx.fillStyle = "#fff"; ctx.fillRect(p.x - th / 6, p.y + 4, th / 3, len);
      } else {
        const bx = p.facing === 1 ? p.x + PLAYER_W / 2 - 6 : p.x - PLAYER_W / 2 - len + 6;
        const cy = p.y - PLAYER_H / 2 - 4;
        ctx.fillStyle = grad; ctx.fillRect(bx, cy - th / 2, len, th);
        ctx.fillStyle = "#fff"; ctx.fillRect(bx, cy - th / 6, len, th / 3);
      }
      ctx.restore();
    } else {
    const hasReach = p.itemType === "reach";
    const drawRange = atk.range * (hasReach ? ITEM.reachMult : 1);
    if (hasReach) {
      ctx.strokeStyle = "rgba(255,150,60," + (0.95 - prog * 0.4) + ")";
      ctx.lineWidth = p.attackIsSpecial ? 15 : 10;
    } else if (p.attackIsSpecial) {
      ctx.strokeStyle = "rgba(255,180,60," + (0.95 - prog * 0.4) + ")";
      ctx.lineWidth = 13;
    } else {
      ctx.strokeStyle = "rgba(255,255,255," + (0.9 - prog * 0.5) + ")";
      ctx.lineWidth = 7;
    }
    ctx.beginPath();
    if (p.attackDir === "up") {
      const cx = p.x, cy = p.y - PLAYER_H + 4;
      ctx.arc(cx, cy, drawRange - 4, Math.PI + 0.3, Math.PI * 2 - 0.3, false);
    } else if (p.attackDir === "down") {
      const cx = p.x, cy = p.y - 4;
      ctx.arc(cx, cy, drawRange - 4, 0.3, Math.PI - 0.3, false);
    } else {
      const cx = p.facing === 1 ? p.x + PLAYER_W / 2 : p.x - PLAYER_W / 2;
      const cy = p.y - PLAYER_H / 2 - 4;
      const a0 = p.facing === 1 ? -1.3 : Math.PI + 1.3;
      const a1 = p.facing === 1 ? 1.1 : Math.PI - 1.1;
      ctx.arc(cx, cy, drawRange - 4, a0, a1, p.facing !== 1);
    }
    ctx.stroke();
    }
  }

  // 復活風船（ふわふわ降下中。頭上に大きめの縞模様バルーン＋糸）
  if (p.respawning) {
    const bx = p.x, byTop = by - 40;
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx - 6, by + 2); ctx.lineTo(bx, byTop + 18); ctx.moveTo(bx + 6, by + 2); ctx.lineTo(bx, byTop + 18); ctx.stroke();
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = COLORS[p.slot]; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(bx, byTop, 18, 22, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 縞模様（プレイヤー色）
    ctx.save(); ctx.beginPath(); ctx.ellipse(bx, byTop, 18, 22, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = COLORS[p.slot];
    ctx.fillRect(bx - 18, byTop - 22, 7, 44); ctx.fillRect(bx - 2, byTop - 22, 7, 44); ctx.fillRect(bx + 12, byTop - 22, 7, 44);
    ctx.restore();
    ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.ellipse(bx - 6, byTop - 8, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    // 「S で降りる」ヒント
    ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Sで降りる", p.x, byTop - 28);
  }

  // 風船（浮上中: 背中の上に風船＋糸。残り燃料でしぼむ）
  if (p.ballooning && p.balloonFuel > 0) {
    const frac = p.balloonFuel / BALLOON.fuel;
    const bx = p.x - p.facing * 8, byTop = by - 22 - 14 * frac;
    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx, by + 2); ctx.lineTo(bx, byTop + 12); ctx.stroke();
    ctx.fillStyle = COLORS[p.slot];
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(bx, byTop, 13 * (0.6 + 0.4 * frac), 16 * (0.6 + 0.4 * frac), 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(bx - 4, byTop - 5, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 必殺技チャージ中のオーラ
  if (p.chargeTimer > 0) {
    const t = Math.min(1, p.chargeTimer / SPECIAL_CHARGE);
    const r = PLAYER_W * 0.9 + t * 26;
    ctx.globalAlpha = 0.35 + 0.4 * t;
    ctx.strokeStyle = t >= 1 ? "#ff5030" : "#ffb43c";
    ctx.lineWidth = 2 + 4 * t;
    ctx.beginPath();
    ctx.arc(p.x, p.y - PLAYER_H / 2, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // チャージゲージ（頭上）
    const gw = 44, gx = p.x - gw / 2, gy = by - 26;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(gx, gy, gw, 6);
    ctx.fillStyle = t >= 1 ? "#ff5030" : "#ffd34d";
    ctx.fillRect(gx, gy, gw * t, 6);
  }

  // アイテム所持中: 足元の光るリング（残り時間で細くなる）＋取得フラッシュ
  if (p.itemType && p.itemTimer > 0) {
    const st = ITEM_STYLE[p.itemType];
    const frac = p.itemTimer / ITEM.duration[p.itemType];
    ctx.save();
    ctx.strokeStyle = st.color;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    // 足元の弧（残り時間ぶん）
    ctx.arc(p.x, p.y - 4, PLAYER_W * 0.75, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
    if (p.itemGetFlash > 0) {
      ctx.globalAlpha = p.itemGetFlash / 24;
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y - PLAYER_H / 2, PLAYER_W, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 頭上の名前
  ctx.globalAlpha = Math.min(ctx.globalAlpha, 0.9);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(NAMES[p.slot], p.x, by - 8);
  ctx.globalAlpha = 1;
  // アイテムアイコン（名前の上）
  if (p.itemType && p.itemTimer > 0) {
    const st = ITEM_STYLE[p.itemType];
    ctx.fillStyle = st.color;
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(st.label, p.x, by - 24);
  }

  // ガードの卵（残量ぶんだけ大きさが変わる。半透明の殻）
  if (p.guarding && p.guardHp > 0) {
    const frac = p.guardHp / GUARD.max;
    const cx = p.x, cy = p.y - PLAYER_H / 2;
    const rx = (PLAYER_W * 0.62 + 12) * (0.45 + 0.55 * frac);
    const ry = (PLAYER_H * 0.62 + 12) * (0.45 + 0.55 * frac);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    // 卵型（上が細く下が丸い）
    ctx.moveTo(0, -ry);
    ctx.bezierCurveTo(rx, -ry, rx, ry * 0.55, 0, ry);
    ctx.bezierCurveTo(-rx, ry * 0.55, -rx, -ry, 0, -ry);
    ctx.closePath();
    ctx.fillStyle = "rgba(180,230,255," + (0.18 + 0.22 * frac) + ")";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(210,245,255," + (0.5 + 0.4 * frac) + ")";
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();   // 巨大化スケール解除
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function damageColor(d) {
  if (d < 40) return "#ffffff";
  if (d < 80) return "#ffd34d";
  if (d < 120) return "#ff8c42";
  return "#ff4040";
}

function drawHUD(m) {
  const n = m.players.length;
  const panelW = 190, gap = 26;
  const totalW = n * panelW + (n - 1) * gap;
  let x = (W - totalW) / 2;
  for (const p of m.players) {
    ctx.fillStyle = "rgba(10,10,20,0.65)";
    roundRect(x, 632, panelW, 74, 10);
    ctx.fill();
    ctx.strokeStyle = COLORS[p.slot];
    ctx.lineWidth = 3;
    roundRect(x, 632, panelW, 74, 10);
    ctx.stroke();

    ctx.fillStyle = COLORS[p.slot];
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    let nameLabel = NAMES[p.slot];
    if (APP.mode === "online") nameLabel += (p.slot === NET.myIndex) ? " (あなた)" : (NET.dropped.has(p.slot) ? " (退出)" : "");
    ctx.fillText(nameLabel, x + 14, 658);

    // ダメージ%
    ctx.textAlign = "right";
    if (p.alive) {
      ctx.fillStyle = damageColor(p.damage);
      ctx.font = "bold 30px sans-serif";
      ctx.fillText(Math.floor(p.damage) + "%", x + panelW - 14, 665);
    } else {
      ctx.fillStyle = "#888";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText("KO", x + panelW - 14, 662);
    }

    // ストック
    for (let s = 0; s < STOCKS; s++) {
      ctx.beginPath();
      ctx.arc(x + 20 + s * 20, 686, 7, 0, Math.PI * 2);
      ctx.fillStyle = s < p.stocks ? COLORS[p.slot] : "rgba(255,255,255,0.15)";
      ctx.fill();
    }

    // ガードの卵＋風船の残量ゲージ（右側に上下2本）
    const egx = x + panelW - 60, egw = 44, egh = 8;
    ctx.font = "10px sans-serif";
    ctx.textAlign = "right";
    // 卵
    const gframe = p.guardHp / GUARD.max, egy1 = 678;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRect(egx, egy1 - egh / 2, egw, egh, 4); ctx.fill();
    if (p.guardHp > 0) {
      ctx.fillStyle = gframe > 0.35 ? "#bfe8ff" : "#ff8c6b";
      roundRect(egx, egy1 - egh / 2, egw * gframe, egh, 4); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillText("卵", egx - 4, egy1 + 4);
    // 風船
    const bframe = p.balloonFuel / BALLOON.fuel, egy2 = 694;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRect(egx, egy2 - egh / 2, egw, egh, 4); ctx.fill();
    if (p.balloonFuel > 0) {
      ctx.fillStyle = bframe > 0.3 ? "#ffd0e8" : "#ff8c6b";
      roundRect(egx, egy2 - egh / 2, egw * bframe, egh, 4); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fillText("風船", egx - 4, egy2 + 4);

    x += panelW + gap;
  }
}

function controlLinesFor(sourceId) {
  if (sourceId === "kb0") return ["移動: A / D", "ジャンプ: W / 急降下: S", "攻撃: F（上/下だけ入力で上下攻撃・長押し必殺）", "ガード（卵）: G", "風船: Space"];
  if (sourceId === "kb1") return ["移動: H(左) / K(右)", "ジャンプ: U(上) / 急降下: J(下)", "攻撃: L（上/下だけ入力で上下攻撃・長押し必殺）", "ガード（卵）: -（ハイフン）", "風船: .（ピリオド）"];
  return ["移動: スティック/十字", "ジャンプ: A(×) / 急降下: 下", "攻撃: X(□)（上/下入力で上下攻撃・長押し必殺）", "ガード（卵）: L/R", "風船: Y(△)"];
}

// カード表示用の内容（ローカル: 入力ソース別 / オンライン: 自分・相手）
function cardInfoFor(p) {
  // オンライン操作の説明（オンライン本人 or ローカルのソロ本人）
  const onlineControls = { label: "あなた", lines: ["移動: A/D または ←/→（W・↑ジャンプ / S・↓急降下）", "攻撃: J（上/下だけ入力で上下攻撃・長押し必殺）", "ガード（卵）: K", "風船: Space（浮上・落下防止）"] };
  if (APP.mode === "online") {
    if (p.slot === NET.myIndex) return onlineControls;
    return { label: "相手（オンライン）", lines: ["リモートプレイヤー", "", "", "", ""] };
  }
  if (p.slot === APP.soloSlot) return onlineControls;
  if (APP.slots[p.slot] && APP.slots[p.slot].cpu) return { label: "CPU", lines: ["コンピュータ操作", "", "", "", ""] };
  const src = APP.slots[p.slot].source;
  return { label: src.label, lines: controlLinesFor(src.id) };
}

// 参加中プレイヤーそれぞれの操作方法カード（カウントダウン中に表示）
function drawControlCards(m, topY) {
  const n = m.players.length;
  const cardW = 272, cardH = 200, gap = 20;
  const totalW = n * cardW + (n - 1) * gap;
  let x = (W - totalW) / 2;
  for (const p of m.players) {
    const info = cardInfoFor(p);
    ctx.fillStyle = "rgba(12,12,26,0.88)";
    roundRect(x, topY, cardW, cardH, 12);
    ctx.fill();
    ctx.strokeStyle = COLORS[p.slot];
    ctx.lineWidth = 3;
    roundRect(x, topY, cardW, cardH, 12);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.fillStyle = COLORS[p.slot];
    ctx.font = "bold 20px sans-serif";
    ctx.fillText(NAMES[p.slot], x + 16, topY + 30);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "12px sans-serif";
    ctx.fillText(info.label, x + 60, topY + 30);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    info.lines.forEach((t, i) => {
      ctx.fillText(t, x + 16, topY + 62 + i * 26);
    });
    x += cardW + gap;
  }
}

function drawMatch() {
  const m = APP.match;
  ctx.save();
  if (fx.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
  }
  drawBackground(m.stage);
  drawStage(m.platforms, m.stage.theme);
  if (m.risingLava) drawPit(m);
  if (m.lava.length) drawLavaZones(m.lava);
  if (m.warps.length) drawWarps(m.warps, m.warpOn, m.warpTimer);
  if (m.walls.length) drawWalls(m.walls, m.groundY, m.stage.theme);
  for (const it of m.items) drawItem(it);
  for (const p of m.players) drawPlayer(p);
  if (m.mob) drawMob(m.mob);
  if (m.pendulums.length) drawPendulums(m.pendulums);

  // 撃墜リング（拡がる輪）
  for (const rg of fx.rings) {
    const r = rg.t * 9;
    ctx.globalAlpha = Math.max(0, 1 - rg.t / 30);
    ctx.strokeStyle = rg.color; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, r * 0.7, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // パーティクル
  for (const pt of fx.particles) {
    ctx.globalAlpha = Math.min(1, pt.life / 12);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (fx.koFlash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + fx.koFlash / 34 + ")";
    ctx.fillRect(0, 0, W, H);
  }
  // 「PX 撃墜！」の表示
  if (fx.koLabel) {
    const a = Math.min(1, fx.koLabel.t / 12);
    ctx.globalAlpha = a;
    ctx.textAlign = "center";
    ctx.font = "bold 72px sans-serif";
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.strokeText(NAMES[fx.koLabel.slot] + " 撃墜！", W / 2, H / 2 - 40);
    ctx.fillStyle = COLORS[fx.koLabel.slot];
    ctx.fillText(NAMES[fx.koLabel.slot] + " 撃墜！", W / 2, H / 2 - 40);
    ctx.globalAlpha = 1;
  }

  drawHUD(m);

  // 残り時間（中央上に mm:ss）
  if (m.countdown === 0) {
    const secs = Math.max(0, Math.ceil(m.timeLeft / 60));
    const mm = Math.floor(secs / 60), ss = secs % 60;
    const txt = mm + ":" + (ss < 10 ? "0" + ss : ss);
    ctx.textAlign = "center";
    ctx.font = "bold 30px sans-serif";
    ctx.fillStyle = secs <= 10 ? "#ff5b5b" : "#fff";
    ctx.fillText(txt, W / 2, 40);
  }

  // 試合中: Tab長押しで操作確認、右上に常時ヒント（HはキーボードP2の左移動に使うため）
  if (m.countdown === 0 && !m.ending) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(APP.mode === "online" ? "Tab長押し: 操作確認 ／ Esc: 退出" : "Tab長押し: 操作確認 ／ Esc: ロビーへ", W - 16, 24);
    if (keys.has("Tab")) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, W, H);
      drawControlCards(m, 200);
    }
  }

  // オンライン: 相手の入力待ちが続いたら表示
  if (APP.mode === "online" && NET.stall > 30) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 34px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("相手の通信待ち…", W / 2, H / 2);
  }

  // カウントダウン（+ ステージ名 + 各プレイヤーの操作方法カード）
  if (m.countdown > 0) {
    const sec = Math.ceil(m.countdown / 60);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd34d";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("STAGE: " + m.stage.name, W / 2, 68);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 120px sans-serif";
    ctx.fillText(String(sec), W / 2, 180);
    drawControlCards(m, 260);
  } else if (m.countdown === 0 && m.tick < COUNTDOWN_TICKS + 50 && !m.ending) {
    ctx.fillStyle = "#ffd34d";
    ctx.font = "bold 110px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GO!", W / 2, H / 2 + 30);
  }

  if (m.ending) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 90px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("決着！", W / 2, H / 2 + 20);
  }
}

function drawLobby() {
  const selStage = STAGES[APP.stageIndex];
  drawBackground(selStage);
  drawStage(selStage.platforms, selStage.theme);   // 選択中ステージを背景にプレビュー
  if (selStage.walls) {                             // 壁は左上・右下のプレビュー
    const snap = wallSnapshot(selStage, 0.75);
    drawWalls(snap.walls, snap.groundY, selStage.theme);
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 64px sans-serif";
  ctx.fillText("ウチスマ！", W / 2, 120);
  ctx.font = "bold 22px sans-serif";
  ctx.fillStyle = "#ffd34d";
  ctx.fillText("β版 — 身内スマッシュ", W / 2, 158);

  // スロット表示
  const slotW = 250, gap = 24;
  const totalW = MAX_PLAYERS * slotW + (MAX_PLAYERS - 1) * gap;
  let x = (W - totalW) / 2;
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const s = APP.slots[i];
    ctx.fillStyle = s ? "rgba(20,20,40,0.85)" : "rgba(20,20,40,0.45)";
    roundRect(x, 210, slotW, 120, 12);
    ctx.fill();
    ctx.strokeStyle = s ? COLORS[i] : "rgba(255,255,255,0.2)";
    ctx.lineWidth = 3;
    roundRect(x, 210, slotW, 120, 12);
    ctx.stroke();

    ctx.fillStyle = s ? COLORS[i] : "rgba(255,255,255,0.4)";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText(NAMES[i], x + slotW / 2, 252);
    ctx.font = "15px sans-serif";
    ctx.fillStyle = s ? "#fff" : "rgba(255,255,255,0.4)";
    ctx.fillText(s ? (s.cpu ? "CPU（コンピュータ）" : s.source.label) : "待機中…", x + slotW / 2, 285);
    if (s) {
      ctx.fillStyle = s.cpu ? "#8fd3ff" : "#7f7";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText(s.cpu ? "CPU" : "参加OK!", x + slotW / 2, 312);
    }
    x += slotW + gap;
  }

  ctx.fillStyle = "#fff";
  ctx.font = "17px sans-serif";
  const lines = [
    "【参加方法】 攻撃ボタンを押すと参加　／　C=CPU追加・X=CPU削除（1人でも遊べる）",
    "キーボード左: WASD移動 / F=攻撃 / G=ガード(卵) / Space=風船",
    "キーボード右: HJKU移動(H左J下K右U上) / L=攻撃 / -=ガード(卵) / .=風船",
    "★攻撃は上/下だけ入力で上下攻撃。2秒長押しで必殺技（ガードを一撃で割る）",
    "★風船=Space長押しで浮上（落下防止）。1ストック1回・使い切ると割れる。卵も使い切ると割れる",
    "★アイテムが空から落下！ リーチ延長／移動＆ジャンプ1.5倍／長距離ビーム の3種",
  ];
  lines.forEach((t, i) => ctx.fillText(t, W / 2, 380 + i * 26));

  const joined = APP.slots.filter(Boolean).length;
  const humanCount = APP.slots.filter(s => s && !s.cpu).length;
  ctx.font = "bold 26px sans-serif";
  if (joined >= 2) {
    if (Math.floor(performance.now() / 400) % 2 === 0) {
      ctx.fillStyle = "#ffd34d";
      ctx.fillText("Enter / Start で開始！", W / 2, 538);
    }
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillText("2人以上そろうと開始できます（CはCPU追加）", W / 2, 538);
  }
  // ソロ（人間1人）のときの操作案内
  if (humanCount === 1 && joined >= 2) {
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#8fd3ff";
    ctx.fillText("1人プレイの操作 → 移動: WASD / 矢印　攻撃: J　ガード: K　風船: Space", W / 2, 562);
  }

  // ステージ選択（左右キーで変更）
  ctx.font = "bold 22px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("◀  ステージ: " + selStage.name + "  （" + (APP.stageIndex + 1) + "/" + STAGES.length + "）  ▶", W / 2, 588);
  ctx.font = "13px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillText("← → （移動キー左右）でステージ変更", W / 2, 610);

  ctx.font = "bold 20px sans-serif";
  ctx.fillStyle = "#8fd3ff";
  ctx.fillText("O キー: オンライン対戦（2〜4人・β）", W / 2, 640);

  const pads = navigator.getGamepads();
  let padCount = 0;
  for (let i = 0; i < pads.length; i++) if (pads[i]) padCount++;
  ctx.font = "14px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillText("接続中のゲームパッド: " + padCount + "台（ボタンを押すと認識されます）", W / 2, 700);
}

function drawResult() {
  const rStage = APP.match ? APP.match.stage : STAGES[APP.stageIndex];
  const rPlats = APP.match ? APP.match.platforms : rStage.platforms;
  drawBackground(rStage);
  drawStage(rPlats, rStage.theme);
  if (APP.match && APP.match.walls.length) drawWalls(APP.match.walls, APP.match.groundY, rStage.theme);
  else if (!APP.match && rStage.walls) { const s = wallSnapshot(rStage, 0.75); drawWalls(s.walls, s.groundY, rStage.theme); }
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const info = APP.resultInfo;
  const ws = info.winnerSlot;
  // 勝者
  ctx.font = "bold 66px sans-serif";
  if (ws !== null) { ctx.fillStyle = COLORS[ws]; ctx.fillText(NAMES[ws] + " の勝ち！", W / 2, 130); }
  else { ctx.fillStyle = "#fff"; ctx.fillText("引き分け！", W / 2, 130); }
  if (info.timeUp) { ctx.fillStyle = "#ffd34d"; ctx.font = "bold 22px sans-serif"; ctx.fillText("タイムアップ（残ストック→与ダメージで判定）", W / 2, 168); }

  // スコア表（各プレイヤーの与ダメージ）
  const scores = (info.scores || []).slice().sort((a, b) => (b.stocks - a.stocks) || (b.dealt - a.dealt));
  const rowH = 46, tableW = 560, x0 = (W - tableW) / 2;
  let y = 230;
  ctx.font = "bold 16px sans-serif"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fillText("プレイヤー", x0 + 14, y - 12);
  ctx.textAlign = "center"; ctx.fillText("与えたダメージ", x0 + 300, y - 12);
  ctx.fillText("残ストック", x0 + 450, y - 12);
  for (const s of scores) {
    ctx.fillStyle = "rgba(15,15,28,0.8)";
    roundRect(x0, y, tableW, rowH - 8, 8); ctx.fill();
    ctx.strokeStyle = COLORS[s.slot]; ctx.lineWidth = 2.5; roundRect(x0, y, tableW, rowH - 8, 8); ctx.stroke();
    ctx.fillStyle = COLORS[s.slot]; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "left";
    let nm = NAMES[s.slot];
    if (APP.mode === "online") nm += (s.slot === NET.myIndex ? " (あなた)" : "");
    else if (s.slot === APP.soloSlot) nm += " (あなた)";
    else if (APP.slots[s.slot] && APP.slots[s.slot].cpu) nm += " (CPU)";
    ctx.fillText(nm, x0 + 14, y + 26);
    ctx.textAlign = "center"; ctx.fillStyle = "#ffd34d"; ctx.font = "bold 24px sans-serif";
    ctx.fillText(s.dealt + "%", x0 + 300, y + 27);
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif";
    ctx.fillText(s.stocks > 0 ? "●".repeat(s.stocks) : "—", x0 + 450, y + 27);
    y += rowH;
  }

  // 次のステージ選択（結果画面で変えてそのまま再戦できる）
  const canPick = (APP.mode !== "online") || NET.isHost;
  const nextIdx = (APP.mode === "online" && !NET.isHost) ? (NET.remoteStage != null ? NET.remoteStage : APP.stageIndex) : APP.stageIndex;
  const selY = Math.max(y + 30, H - 118);
  ctx.textAlign = "center"; ctx.font = "bold 22px sans-serif"; ctx.fillStyle = "#fff";
  const arrows = canPick ? "◀  " : "";
  const arrowsR = canPick ? "  ▶" : "";
  ctx.fillText(arrows + "次のステージ: " + STAGES[nextIdx].name + arrowsR, W / 2, selY);
  if (canPick) { ctx.font = "13px sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.fillText("← → でステージ変更", W / 2, selY + 22); }

  ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
  const btmY = selY + 54;
  if (APP.mode === "online") {
    ctx.fillText(NET.isHost ? "Enter: このステージで再戦 ／ Esc: 退出" : "ホストの再戦待ち… ／ Esc: 退出", W / 2, btmY);
  } else {
    ctx.fillText("Enter: このステージで再戦 ／ Esc: ロビーへ", W / 2, btmY);
  }
}

/* ==================== メインループ ==================== */

function runTick() {
  if (APP.phase === "lobby") updateLobby();
  else if (APP.phase === "match") updateMatch();
  else if (APP.phase === "result") updateResult();
  updateFx();
}

function renderNow() {
  if (APP.phase === "lobby") drawLobby();
  else if (APP.phase === "match") drawMatch();
  else if (APP.phase === "result") drawResult();
}

let last = performance.now();
let acc = 0;

function frame(now) {
  acc += now - last;
  last = now;
  if (acc > 250) acc = 250;   // タブ復帰時の暴走防止

  while (acc >= TICK_MS) {
    runTick();
    acc -= TICK_MS;
  }
  renderNow();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// デバッグ/テスト用API（決定論的simを外から直接駆動できる）
window.UCHI = {
  APP, keys, runTick, renderNow,
  makeMatchState, stepMatch, makePlayer,
  PHYS, ATTACK, SPECIAL, GUARD, STAGES, BLAST, STOCKS, ITEM, BALLOON, MOB, rngNext,
  CRUMBLE, PENDULUM, LAVA, WARP_CD, PLAYER_W, PLAYER_H,
  NET, netHost, netJoin, netHostStart, encodeSample, decodeSample,
  makeCpuSource, cpuThink,
};
</script>
