<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウチスマ！β</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #14141e;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #1a1a28;
    max-width: 100%; max-height: 100%;
    image-rendering: auto;
  }
  /* オンライン対戦メニュー */
  #online {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6);
    z-index: 10;
  }
  #online[hidden] { display: none; }
  #online .panel {
    background: #1c1c30; color: #fff;
    border: 2px solid #5a5a8a; border-radius: 14px;
    padding: 28px 34px; width: 420px; max-width: 90vw;
    text-align: center;
  }
  #online h2 { margin: 0 0 6px; font-size: 22px; }
  #online .sub { color: #aab; font-size: 13px; margin-bottom: 18px; }
  #online button {
    font-size: 16px; font-weight: bold;
    padding: 10px 18px; margin: 6px 4px;
    border: none; border-radius: 8px; cursor: pointer;
    background: #3f6fd8; color: #fff;
  }
  #online button.secondary { background: #444460; }
  #online button:disabled { opacity: 0.5; cursor: default; }
  #online input {
    font-size: 20px; text-align: center; text-transform: uppercase;
    width: 120px; padding: 8px; border-radius: 8px;
    border: 1px solid #666; background: #12121f; color: #fff;
    letter-spacing: 4px;
  }
  #ol-code-view { font-size: 40px; font-weight: bold; letter-spacing: 10px; color: #ffd34d; margin: 10px 0 4px; }
  #ol-share { font-size: 12px; color: #9ab; word-break: break-all; margin-bottom: 8px; user-select: all; }
  #ol-status { min-height: 22px; color: #ffb0b0; font-size: 14px; margin-top: 10px; }
  .ol-note { font-size: 12px; color: #889; margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>

<div id="online" hidden>
  <div class="panel">
    <h2>オンライン対戦（2〜4人・β）</h2>
    <div class="sub">ホスト=P1、参加した順に P2 / P3 / P4 になります（最大4人）</div>
    <div id="ol-idle">
      <button id="btn-host">部屋を作る（ホスト）</button>
      <div style="margin:12px 0 6px;color:#889">─ または ─</div>
      <input id="join-code" placeholder="コード" maxlength="4">
      <button id="btn-join">部屋に入る</button>
    </div>
    <div id="ol-room" hidden>
      <div id="ol-code-view"></div>
      <div>
        <button id="btn-copy-code" class="secondary" style="padding:5px 12px;font-size:13px;">コードをコピー</button>
        <button id="btn-copy-url" class="secondary" style="padding:5px 12px;font-size:13px;">URLをコピー</button>
      </div>
      <div id="ol-share"></div>
      <div id="ol-room-msg" style="font-size:15px;color:#cde"></div>
      <div id="ol-stage" hidden style="margin:12px 0 6px;">
        <button id="ol-stage-prev" class="secondary" style="padding:6px 12px;">◀</button>
        <span id="ol-stage-name" style="display:inline-block;min-width:150px;font-weight:bold;color:#ffd34d;"></span>
        <button id="ol-stage-next" class="secondary" style="padding:6px 12px;">▶</button>
      </div>
      <button id="btn-start" hidden>対戦開始！</button>
    </div>
    <div id="ol-status"></div>
    <button id="btn-close" class="secondary">閉じる（切断してローカルへ）</button>
    <div class="ol-note">※ 通信はP2P（PeerJS）。まれに接続できないネット環境があります。<br>コードを電話・LINEなどで相手に伝えてください。</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

 *  2. 「入力ソース」抽象化: キーボード2系統 + ゲームパッド + (将来)ネットワーク
 *     すべて同じ InputSample {left,right,up,down,jump,attack,start} を返す
 *  3. シミュレーションは決定論的:
 *     stepMatch(state, samples[]) は「状態 + 今フレームの全員の入力」だけで
 *     次の状態が決まる。乱数・時刻・描画に依存しない。
 *     → 将来のオンライン化(入力同期方式)でこの関数をそのまま使える
 *  4. 描画・パーティクル・画面揺れは sim が返すイベントから生成（非決定でOK）
 * ===================================================================== */

      { x: 540, y: 530, w: 200, droppable: false, move: { axis: "y", range: 70, speed: 0.7, dir: 1 } },
      { x: 250, y: 440, w: 140, droppable: true, crumble: true },      // 崩れ足場（左）
      { x: 890, y: 440, w: 140, droppable: true, crumble: true },      // 崩れ足場（右）
    ],
    spawns: [ {x:230,y:560}, {x:1050,y:560}, {x:330,y:560}, {x:950,y:560} ],
    risingLava: {
      x: 500, w: 280,            // 中央の縦穴（左島右端500〜右島左端780）
      restY: 1090, peakY: 560,   // 引ききり上面(BLAST.bottom=1050より下＝奈落) / 最高到達＝島の高さ560
      bottomY: 1140,             // 溶岩矩形の下端（画面外まで満たす）
      downTicks: 372, riseTicks: 96, upTicks: 72, fallTicks: 60,  // 約10秒周期(600tick): 奈落6.2s→上昇1.6s→滞留1.2s→下降1.0s
    },

const COLORS   = ["#e74c3c", "#3ee657", "#f1c40f", "#3498db"];  // P1赤 P2緑 P3黄 P4青
const COLORS_D = ["#a93226", "#1fa83b", "#b7950b", "#21618c"];
const NAMES    = ["P1", "P2", "P3", "P4"];

/* ======================= 入力レイヤー ======================= */
// 押下中キーの集合（ブラウザイベント → ここに集約）
const keys = new Set();
const USED_CODES = new Set([
  "KeyW","KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyO","KeyJ","KeyK","KeyC","KeyX",
  "KeyU","KeyL","Minus","Tab",
  "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Comma","Period","Slash",
  "Enter","Escape","Space",
]);
// 入力欄（オンラインのコード入力など）にフォーカス中はゲーム操作としてキーを拾わない
function typingInField() {
  const el = document.activeElement;
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
}
window.addEventListener("keydown", e => {
  if (typingInField()) return;                 // コード入力中はそのまま入力欄へ
  if (USED_CODES.has(e.code)) e.preventDefault();
  if (!e.repeat) keys.add(e.code);
});
window.addEventListener("keyup", e => { if (typingInField()) return; keys.delete(e.code); });
window.addEventListener("blur", () => keys.clear());

const NEUTRAL = Object.freeze({ left:false,right:false,up:false,down:false,jump:false,attack:false,guard:false,balloon:false,start:false });

// キーボード2系統のマッピング
const KB_MAPS = [
  { left:"KeyA", right:"KeyD", up:"KeyW", down:"KeyS", jump:"KeyW", attack:"KeyF", guard:"KeyG", balloon:"Space" },
  { left:"KeyH", right:"KeyK", up:"KeyU", down:"KeyJ", jump:"KeyU", attack:"KeyL", guard:"Minus", balloon:"Period" },
];

// 入力ソース: sample() が InputSample を返す。将来 NetworkSource を足すだけでオンライン化できる
function makeKeyboardSource(mapIdx) {
  const m = KB_MAPS[mapIdx];
  return {
    id: "kb" + mapIdx,
    label: mapIdx === 0 ? "キーボード左 (WASD+F)" : "キーボード右 (HJKU+L)",
    sample() {
      return {
        left: keys.has(m.left), right: keys.has(m.right),
        up: keys.has(m.up), down: keys.has(m.down),
        jump: keys.has(m.jump), attack: keys.has(m.attack),
        guard: keys.has(m.guard), balloon: keys.has(m.balloon),
        start: keys.has("Enter"),
      };
    },
  };
}

function makeGamepadSource(index) {
  return {
    id: "pad" + index,
    label: "パッド" + (index + 1),
    sample() {
      const gp = navigator.getGamepads()[index];
      if (!gp) return NEUTRAL;
      const ax = gp.axes[0] || 0;
      const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      return {
        left:  ax < -0.4 || btn(14),
        right: ax >  0.4 || btn(15),
        up:    (gp.axes[1] || 0) < -0.5 || btn(12),
        down:  (gp.axes[1] || 0) >  0.5 || btn(13),
        jump:  btn(0) || btn(1),          // A/B (×/○)
        attack: btn(2),                   // X (□)
        balloon: btn(3),                  // Y (△) = 風船
        guard: btn(4) || btn(5) || btn(6) || btn(7),  // L/R (ショルダー/トリガー)
        start: btn(9),
      };
    },
  };
}

// CPU（AI）入力ソース。ローカル専用。sample(slot, match) で盤面を見て入力を決める
let cpuCounter = 0;
function makeCpuSource() {
  return {
    id: "cpu" + (cpuCounter++),
    label: "CPU",
    isCpu: true,
    st: { jumpCd: 0, atkCd: 0, atkHold: 0, guardCd: 0 },
    sample(slot, m) { return m ? cpuThink(this, slot, m) : NEUTRAL; },
  };
}

// CPU思考: 最寄りの相手へ積極的に接近して連打、上下も狙う。崖外なら確実に復帰。
function cpuThink(src, slot, m) {
  const st = src.st;
  if (st.jumpCd > 0) st.jumpCd--;
  if (st.atkCd > 0) st.atkCd--;
  if (st.guardCd > 0) st.guardCd--;
  const inp = { left:false, right:false, up:false, down:false, jump:false, attack:false, guard:false, balloon:false, start:false };
  const me = m.players.find(p => p.slot === slot);
  if (!me || !me.alive) return inp;

  // 最寄りの生存相手
  let tgt = null, best = 1e9;
  for (const p of m.players) {
    if (p.slot === slot || !p.alive) continue;
    const d = Math.abs(p.x - me.x) + Math.abs(p.y - me.y) * 0.6;
    if (d < best) { best = d; tgt = p; }
  }

  const g = m.groundY;
  const overGround = m.platforms.some(pl => pl.main && me.x > pl.x - 20 && me.x < pl.x + pl.w + 20);
  const needRecover = !me.onGround && me.y > 200 && (me.y > g + 30 || !overGround);

  // --- 復帰: 崖外/落下中は中央へ確実に戻る（ジャンプ→風船） ---
  if (needRecover) {
    if (me.x < W / 2) inp.right = true; else inp.left = true;
    if (me.airJumps > 0 && st.jumpCd <= 0) { inp.jump = true; st.jumpCd = 10; }
    if (me.y > g + 70 && me.balloonFuel > 0) inp.balloon = true;   // やや深いと即風船
    return inp;
  }

  if (!tgt) return inp;
  const dx = tgt.x - me.x, dy = tgt.y - me.y, adx = Math.abs(dx), ady = Math.abs(dy);
  const face = dx >= 0 ? 1 : -1;

  // 接近（近づき切るまで詰める）。進む先の足場/奈落を見て自滅を避ける
  if (adx > 30) {
    const probeX = me.x + face * (PLAYER_W / 2 + 14);
    const outerEdge = me.onGround && ((me.x < 120 && face < 0) || (me.x > W - 120 && face > 0));
    const groundAhead = m.platforms.some(pl => probeX > pl.x && probeX < pl.x + pl.w && Math.abs(me.y - pl.y) < 2);
    // 進む先の下方に着地できる地面があるか（薄い足場から降りて回り込む用）
    const groundBelow = m.platforms.some(pl => probeX > pl.x && probeX < pl.x + pl.w && pl.y > me.y + 4 && pl.y < me.y + 220);
    if (outerEdge) {
      // 外周の崖: 歩いて出ない（攻撃だけ）
    } else if (me.onGround && !groundAhead) {
      if (groundBelow) {
        // 下に地面あり: 降りて追う（端から落ちて下の地面へ）
        if (dx > 0) inp.right = true; else inp.left = true;
      } else if (dy > -40 && adx < 240 && st.jumpCd <= 0) {
        // 真下は奈落: 届く範囲なら飛び越える
        inp.jump = true; st.jumpCd = 16;
        if (dx > 0) inp.right = true; else inp.left = true;
      }
      // それ以外は縁で止まる（自滅回避）
    } else {
      if (dx > 0) inp.right = true; else inp.left = true;
    }
  }

  // 相手が上にいれば積極的にジャンプで追う（真下に回り込んでから跳ぶと足場に乗りやすい）
  if (dy < -42 && adx < 120 && st.jumpCd <= 0) {
    if (me.onGround) { inp.jump = true; st.jumpCd = 14; }
    else if (me.airJumps > 0 && me.vy > -2) { inp.jump = true; st.jumpCd = 14; }
  }
  // 相手が下にいて自分が足場の上なら、降りて追う（すり抜け）
  if (dy > 90 && me.onGround && adx < 60 && ((m.tick + slot * 7) % 30 < 3)) { inp.down = true; }

  // 攻撃: 射程内なら頻繁に。上/下も狙う
  const upAtk = dy < -32 && adx < 42;
  const downAtk = dy > 34 && adx < 42 && !me.onGround;
  const inRange = adx < 64 && ady < 60;
  const applyDir = () => { if (upAtk) { inp.up = true; inp.left = false; inp.right = false; } else if (downAtk) { inp.down = true; inp.left = false; inp.right = false; } };
  if (st.atkHold > 0) { inp.attack = true; st.atkHold--; applyDir(); }
  else if (inRange && st.atkCd <= 0) { st.atkHold = 3; st.atkCd = 18; inp.attack = true; st.atkHold--; applyDir(); }
  // 相手の攻撃/チャージが近いとガードで受ける
  else if (best < 74 && (tgt.attackTimer > 0 || tgt.chargeTimer > 20) && me.onGround && st.guardCd <= 0) {
    inp.guard = true; st.guardCd = 22; inp.left = false; inp.right = false;
  }
  return inp;
}

/* ==================== シミュレーション ==================== */

function makePlayer(slotIdx, stage) {
  const sp = stage.spawns[slotIdx];
  return {
    slot: slotIdx,
    x: sp.x, y: sp.y - 40,       // y は足元
    vx: 0, vy: 0,
    facing: sp.x < W / 2 ? 1 : -1,
    onGround: false,
    airJumps: PHYS.airJumps,
    dropTimer: 0,                 // すり抜け降下中の無視時間
    damage: 0,
    damageDealt: 0,               // このプレイヤーが与えた総ダメージ（スコア）
    stocks: STOCKS,
    alive: true,
    invuln: 90,
    hitstun: 0,
    attackTimer: 0,
    attackIsSpecial: false,       // 現在の攻撃が必殺技か
    attackVictims: [],
    chargeTimer: 0,               // 必殺技チャージ経過tick（攻撃長押し）
    guardHp: GUARD.max,           // 卵の残量（0で使い切り＝復活まで使えない）
    guarding: false,
    guardBreakFlash: 0,
    itemType: null,               // 所持中アイテム効果 "reach" | "speed" | null
    itemTimer: 0,                 // 効果の残り時間tick
    itemGetFlash: 0,
    balloonFuel: BALLOON.fuel,    // 風船の残り燃料（0で割れて復活まで使えない）
    ballooning: false,
    respawning: false,            // 復活風船でふわふわ降下中
    attackDir: "fwd",             // 攻撃の向き "fwd" | "up" | "down"
    warpCd: 0,                    // ワープ後クールダウン
    stepPhase: 0,                 // 足のちょこちょこアニメ位相
    hitFlash: 0,
    prev: NEUTRAL,                // 前フレーム入力（エッジ検出用・状態の一部として保持）
  };
}

function makeMatchState(slotIndices, stageIndex) {
  const idx = (stageIndex | 0) % STAGES.length;
  const stage = STAGES[idx];
  // 決定論PRNGの種（両クライアントで同一）。0は不可なので必ず非0に。
  let seed = ((idx + 1) * 2654435761) | 0;
  if (seed === 0) seed = 1;
  // 足場は可変（動く床）なのでライブなコピーを作る（静的STAGESは書き換えない）
  const platforms = stage.platforms.map(pl => {
    const c = { x: pl.x, y: pl.y, w: pl.w, droppable: pl.droppable, main: pl.main, dx: 0, dy: 0 };
    if (pl.move) {
      c.baseX = pl.x; c.baseY = pl.y;
      c.moveAxis = pl.move.axis; c.moveRange = pl.move.range;
      c.off = 0; c.vel = pl.move.speed * (pl.move.dir || 1);
    }
    if (pl.conveyor) c.conveyor = pl.conveyor;   // 毎tick押す量(+右/-左)
    if (pl.bounce) c.bounce = pl.bounce;         // トランポリン: 着地で上へ跳ねる
    if (pl.crumble) { c.crumble = true; c.crumbleState = "solid"; c.crumbleTimer = 0; }
    return c;
  });
  // 地面の高さ（動く壁の基準）
  const mains = stage.platforms.filter(p => p.main);
  const groundY = mains.length ? Math.max(...mains.map(p => p.y)) : 585;
  // 動く壁のライブコピー
  const walls = (stage.walls || []).map(w => ({
    x: w.x, w: w.w, height: w.height, side: w.side,
    top: groundY + 8, bottom: groundY + 40, raise: 0,
  }));
  // 溶岩（静的 or せり上がり）。せり上がりステージは動的矩形を1つ足し、risingLavaで毎tick駆動する
  const lava = (stage.lava || []).map(l => ({ x: l.x, y: l.y, w: l.w, h: l.h }));
  let risingLava = null;
  if (stage.risingLava) {
    const c = stage.risingLava;
    const lavaIndex = lava.length;
    lava.push({ x: c.x, y: c.restY, w: c.w, h: c.bottomY - c.restY });   // 動的な溶岩面
    risingLava = {
      x: c.x, w: c.w, restY: c.restY, peakY: c.peakY, bottomY: c.bottomY,
      downTicks: c.downTicks, riseTicks: c.riseTicks, upTicks: c.upTicks, fallTicks: c.fallTicks,
      phase: "down", timer: c.downTicks, prog: 0, topY: c.restY,
      lavaIndex,
    };
  }
  return {
    tick: 0,
    countdown: COUNTDOWN_TICKS,
    timeLeft: TIME_LIMIT,         // 残り時間（tick）。0で時間切れ決着
    hitstop: 0,
    ending: false,
    endTimer: 0,
    finished: false,
    winnerSlot: null,
    timeUp: false,
    stageIndex: idx,
    stage,
    platforms,                    // ライブな足場（動く床を含む）
    groundY,                      // 地面の高さ（壁の基準）
    walls,                        // 動く壁（ライブ）
    wallPhase: 0,                 // 0..1 の位相（三角波）
    wallVel: stage.wallSpeed || 0,
    // ドスン風モブ（stage.mob フラグのあるステージのみ）
    mob: stage.mob ? { x: stage.mobX || 640, homeX: stage.mobX || 640, y: groundY - MOB.size, vy: 0, state: "rise", timer: 0, swayOff: 0, swayVel: MOB.swaySpeed, victims: [] } : null,
    // 振り子（振れる球のハザード）。調和振動で下(off=0)が最速＝本物の振り子挙動
    pendulums: (stage.pendulums || []).map(pd => {
      const om = 2 * Math.PI / (pd.period || 130);   // Math.PIは定数＝決定論的
      const inside0 = pd.len * pd.len - pd.amp * pd.amp;
      return {
        pivotX: pd.pivotX, pivotY: pd.pivotY, len: pd.len, amp: pd.amp, r: pd.r || PENDULUM.r,
        k: om * om, off: pd.amp, vel: 0,
        x: pd.pivotX + pd.amp, y: pd.pivotY + Math.sqrt(inside0 > 0 ? inside0 : 0),
      };
    }),
    lava,                         // 溶岩の矩形（静的＋せり上がり動的）
    risingLava,                   // せり上がり溶岩の状態（無いステージはnull）
    warps: (stage.warps || []).map(w => ({ x: w.x, y: w.y, w: w.w, h: w.h, link: w.link })),
    warpOn: true, warpTimer: WARP_CYCLE.on,   // ワープ口の出現/消滅サイクル
    rng: seed,                    // xorshift32 の状態
    items: [],                    // 落下中/設置中のアイテム
    itemTimer: ITEM.firstSpawn,   // 次の出現までのtick
    players: slotIndices.map(s => makePlayer(s, stage)),
  };
}

// ドスン風モブを1tick更新（決定論）。rise（風船上昇）→ top到達で割れ → fall → 着地 → wait → rise
function updateMob(state, events) {
  const m = state.mob;
  if (!m) return;
  // 左右ゆらゆら（上昇中のみ。落下/滞留/着地中はx固定でまっすぐ落ちてくる）
  if (m.state === "rise") {
    m.swayOff += m.swayVel;
    if (m.swayOff > MOB.swayRange) { m.swayOff = MOB.swayRange; m.swayVel = -m.swayVel; }
    else if (m.swayOff < -MOB.swayRange) { m.swayOff = -MOB.swayRange; m.swayVel = -m.swayVel; }
    m.x = m.homeX + m.swayOff;
  }
  if (m.state === "rise") {
    m.y -= MOB.riseSpeed;                              // ゆっくり浮上して画面外(上)へ
    if (m.y <= MOB.topY) { m.y = MOB.topY; m.state = "top"; m.timer = MOB.topHold; events.push({ type: "mob-pop", x: m.x + MOB.size / 2, y: m.y }); }
  } else if (m.state === "top") {
    if (--m.timer <= 0) { m.state = "fall"; m.vy = 0; }  // 画面外で溜めてから落下
  } else if (m.state === "fall") {
    m.vy += MOB.fallGravity;
    if (m.vy > MOB.maxFall) m.vy = MOB.maxFall;
    const prevBottom = m.y + MOB.size;
    m.y += m.vy;
    // 普通のキャラと同じく足場の上面へ着地（上からのみ）。溶岩は足場でないので乗らない
    let landedY = null;
    for (const plat of state.platforms) {
      if (plat.crumbleState === "gone") continue;
      if (m.x + MOB.size <= plat.x || m.x >= plat.x + plat.w) continue;
      if (prevBottom <= plat.y && m.y + MOB.size >= plat.y) { landedY = plat.y; break; }
    }
    if (landedY !== null) {
      m.y = landedY - MOB.size; m.vy = 0; m.state = "wait"; m.timer = MOB.waitTicks;
      events.push({ type: "mob-land", x: m.x + MOB.size / 2, y: landedY });
    } else if (m.y > H + 60) {
      // 中央の奈落へ落ちた場合は画面外(上)へ戻して再度ゆらゆら上昇（溶岩には乗らない）
      m.y = MOB.topY; m.state = "top"; m.timer = MOB.topHold;
    }
  } else { // wait（着地して少し休む）
    if (--m.timer <= 0) { m.state = "rise"; m.victims = []; }
  }
  // プレイヤーとの当たり（弾き飛ばす。プレイヤーは無敵化で多段防止）
  for (const p of state.players) {
    if (!p.alive || p.invuln > 0) continue;
    if (rectsOverlap(m.x, m.y, MOB.size, MOB.size, p.x - pHW(p), p.y - pH(p), pHW(p) * 2, pH(p))) {
      const dir = p.x >= m.x + MOB.size / 2 ? 1 : -1;
      p.damage += MOB.damage;
      const kb = MOB.kbBase + p.damage * MOB.kbScale;
      const rad = 45 * Math.PI / 180;
      p.vx = Math.cos(rad) * kb * dir;
      p.vy = -Math.sin(rad) * kb;
      p.hitstun = Math.floor(6 + kb * 2);
      p.onGround = false; p.hitFlash = 8; p.invuln = 20;
      p.chargeTimer = 0; p.attackTimer = 0; p.attackIsSpecial = false;
      state.hitstop = 6;
      events.push({ type: "mob-hit", x: p.x, y: p.y - PLAYER_H / 2, dir, dmg: p.damage });
    }
  }
}

// 崩れる床を1tick更新（乗るとcrack→gone→復活）
function updateCrumble(state) {
  for (const plat of state.platforms) {
    if (!plat.crumble) continue;
    if (plat.crumbleState === "crack") { if (--plat.crumbleTimer <= 0) { plat.crumbleState = "gone"; plat.crumbleTimer = CRUMBLE.goneTicks; } }
    else if (plat.crumbleState === "gone") { if (--plat.crumbleTimer <= 0) { plat.crumbleState = "solid"; } }
  }
}

// 振り子（球）を1tick更新。調和振動(vel += -k*off)で下(off=0)が最速＝本物の振り子。
// arc高さはsqrtで決定論的に算出。当たると弾く
function updatePendulums(state, events) {
  for (const pd of state.pendulums) {
    pd.vel += -pd.k * pd.off;    // 復元加速度（中心=下で最速、端で最遅）
    pd.off += pd.vel;
    if (pd.off > pd.amp) { pd.off = pd.amp; if (pd.vel > 0) pd.vel = 0; }        // 数値誤差の振幅増加を抑制
    else if (pd.off < -pd.amp) { pd.off = -pd.amp; if (pd.vel < 0) pd.vel = 0; }
    pd.x = pd.pivotX + pd.off;
    const inside = pd.len * pd.len - pd.off * pd.off;
    pd.y = pd.pivotY + Math.sqrt(inside > 0 ? inside : 0);
    for (const p of state.players) {
      if (!p.alive || p.invuln > 0) continue;
      const dxp = p.x - pd.x, dyp = (p.y - pH(p) / 2) - pd.y;
      const rr = pd.r + pHW(p) * 0.8;
      if (dxp * dxp + dyp * dyp < rr * rr) {
        const dir = p.x >= pd.x ? 1 : -1;
        p.damage += PENDULUM.damage;
        const kb = PENDULUM.kbBase + p.damage * PENDULUM.kbScale;
        p.vx = KB45 * kb * dir; p.vy = -KB45 * kb;
        p.hitstun = Math.floor(6 + kb * 2);
        p.onGround = false; p.hitFlash = 8; p.invuln = 18;
        p.chargeTimer = 0; p.attackTimer = 0; p.attackIsSpecial = false;
        state.hitstop = 5;
        events.push({ type: "mob-hit", x: p.x, y: p.y - PLAYER_H / 2, dir, dmg: p.damage });
      }
    }
  }
}

// 溶岩: 触れたプレイヤーを上へ跳ね返す（KOではなくダメージ＋ノックバック）
function updateLava(state, events) {
  for (const lv of state.lava) {
    for (const p of state.players) {
      if (!p.alive || p.invuln > 0) continue;
      if (rectsOverlap(lv.x, lv.y, lv.w, lv.h, p.x - pHW(p), p.y - pH(p), pHW(p) * 2, pH(p))) {
        p.damage += LAVA.damage;
        const kb = LAVA.kbBase + p.damage * LAVA.kbScale;
        p.vx = (p.x >= lv.x + lv.w / 2 ? 1 : -1) * kb * 0.5;
        p.vy = -kb;
        p.hitstun = Math.floor(5 + kb * 1.5);
        p.onGround = false; p.hitFlash = 8; p.invuln = 22;
        state.hitstop = 4;
        events.push({ type: "lava-hit", x: p.x, y: p.y - PLAYER_H / 2, dmg: p.damage });
      }
    }
  }
}

// せり上がる溶岩（決定論）: down(奈落)→rise→up→fall を周期。progは整数タイマーから算出。
//   溶岩面(state.lava[lavaIndex])のyと、連動する中央床(floorPlat)のyを毎tick更新する。
//   当たり判定は既存 updateLava が担当（溶岩矩形を動かすだけ）。
function stepRisingLava(state) {
  const rl = state.risingLava;
  if (!rl) return;
  // フェーズ機械（タイマーを減らして状態遷移）
  if (rl.phase === "down") { if (--rl.timer <= 0) { rl.phase = "rise"; rl.timer = rl.riseTicks; } }
  else if (rl.phase === "rise") { if (--rl.timer <= 0) { rl.phase = "up"; rl.timer = rl.upTicks; } }
  else if (rl.phase === "up") { if (--rl.timer <= 0) { rl.phase = "fall"; rl.timer = rl.fallTicks; } }
  else { if (--rl.timer <= 0) { rl.phase = "down"; rl.timer = rl.downTicks; } }
  // 進捗 prog: 0(奈落)→1(最高)。整数/整数のfloat除算＝全環境で同一
  let prog;
  if (rl.phase === "down") prog = 0;
  else if (rl.phase === "rise") prog = (rl.riseTicks - rl.timer) / rl.riseTicks;
  else if (rl.phase === "up") prog = 1;
  else prog = rl.timer / rl.fallTicks;   // fall: 1→0
  rl.prog = prog;
  // 溶岩面のY（restY→peakYを補間）と矩形サイズ
  const topY = rl.restY + (rl.peakY - rl.restY) * prog;
  rl.topY = topY;
  const lv = state.lava[rl.lavaIndex];
  lv.y = topY;
  lv.h = rl.bottomY - topY;
}

// ワープ: 出現↔消滅を繰り返し、出現中だけ入口に触れると対のワープへ瞬間移動
function updateWarps(state, events) {
  // 出現/消滅サイクル
  if (--state.warpTimer <= 0) {
    state.warpOn = !state.warpOn;
    state.warpTimer = state.warpOn ? WARP_CYCLE.on : WARP_CYCLE.off;
    events.push({ type: state.warpOn ? "warp-appear" : "warp-vanish", warps: state.warps });
  }
  if (!state.warpOn) return;   // 消えている間はワープしない
  for (const p of state.players) {
    if (!p.alive) continue;
    if (p.warpCd > 0) { p.warpCd--; continue; }
    const cx = p.x, cy = p.y - PLAYER_H / 2;
    for (let i = 0; i < state.warps.length; i++) {
      const w = state.warps[i];
      if (cx > w.x && cx < w.x + w.w && cy > w.y && cy < w.y + w.h) {
        const dest = state.warps[w.link];
        p.x = dest.x + dest.w / 2;
        p.y = dest.y + dest.h - 2;
        p.vy = Math.min(p.vy, 0);
        p.warpCd = WARP_CD;
        events.push({ type: "warp", x: dest.x + dest.w / 2, y: dest.y + dest.h / 2 });
        break;
      }
    }
  }
}

// 動く壁を1tick更新（決定論）。位相0..1の三角波。左右は逆位相（left=phase, right=1-phase）
function updateWalls(state) {
  if (state.walls.length === 0) return;
  state.wallPhase += state.wallVel;
  if (state.wallPhase >= 1) { state.wallPhase = 1; state.wallVel = -state.wallVel; }
  else if (state.wallPhase <= 0) { state.wallPhase = 0; state.wallVel = -state.wallVel; }
  const g = state.groundY;
  for (const w of state.walls) {
    const raise = w.side === "left" ? state.wallPhase : 1 - state.wallPhase;
    w.raise = raise;
    w.top = g + 8 - (w.height + 8) * raise;  // raise=1→g-height(上), raise=0→g+8(地面下＝隠れる)
    w.bottom = g + 40;
  }
}

// 動く床を1tick更新（決定論: off += vel の三角波）。dx/dyに今tickの移動量を記録
function updateMovingPlatforms(state) {
  for (const plat of state.platforms) {
    plat.dx = 0; plat.dy = 0;
    if (plat.moveAxis === undefined) continue;
    const old = plat.off;
    plat.off += plat.vel;
    if (plat.off > plat.moveRange) { plat.off = plat.moveRange; plat.vel = -plat.vel; }
    else if (plat.off < -plat.moveRange) { plat.off = -plat.moveRange; plat.vel = -plat.vel; }
    const delta = plat.off - old;
    if (plat.moveAxis === "x") { plat.x = plat.baseX + plat.off; plat.dx = delta; }
    else { plat.y = plat.baseY + plat.off; plat.dy = delta; }
  }
}

// 決定論的乱数（xorshift32）。ビット演算のみ＝全環境で同一結果。[0,1) を返す。
function rngNext(state) {
  let x = state.rng | 0;
  x ^= x << 13; x |= 0;
  x ^= x >>> 17;
  x ^= x << 5;  x |= 0;
  state.rng = x;
  return (x >>> 0) / 4294967296;
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// 1tick 進める。決定論的（state と samples のみに依存）
function stepMatch(state, samples) {
  const events = [];
  state.tick++;

  if (state.hitstop > 0) { state.hitstop--; return events; }

  const inCountdown = state.countdown > 0;
  if (inCountdown) {
    state.countdown--;
    if (state.countdown === 0) events.push({ type: "go" });
  }

  const ps = state.players;

  // --- 動く床: 乗っているプレイヤーを一緒に運ぶ ---
  // 1) 移動前の位置で「どの動く床に乗っているか」を判定
  const carriers = ps.map(p => {
    if (!p.alive || !p.onGround) return null;
    for (const plat of state.platforms) {
      if (plat.moveAxis === undefined) continue;   // 動く床（乗っているプレイヤーを運ぶ）だけ対象
      if (p.x >= plat.x && p.x <= plat.x + plat.w && Math.abs(p.y - plat.y) < 1.5) return plat;
    }
    return null;
  });
  // 2) 床を動かす（決定論的）
  updateMovingPlatforms(state);
  updateWalls(state);
  updateCrumble(state);
  if (state.risingLava) stepRisingLava(state);   // 溶岩せり上がりの溶岩面を更新（当たり判定より前）
  // 3) 乗っているプレイヤーを床と一緒に運ぶ。
  //    縦方向は床top(plat.y)へスナップ＝floatズレで着地判定が外れて落ちるのを防ぐ。
  for (let i = 0; i < ps.length; i++) {
    const plat = carriers[i];
    if (plat) { ps[i].x += plat.dx; ps[i].y = plat.y; }
  }

  // --- 各プレイヤーの入力・移動 ---
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (!p.alive) continue;
    const cur = (inCountdown || state.ending) ? NEUTRAL : samples[i];
    const prev = p.prev;
    const canAct = p.hitstun === 0;

    // タイマー類
    if (p.hitstun > 0) p.hitstun--;
    if (p.attackTimer > 0) p.attackTimer--;
    if (p.invuln > 0) p.invuln--;
    if (p.dropTimer > 0) p.dropTimer--;
    if (p.hitFlash > 0) p.hitFlash--;
    if (p.guardBreakFlash > 0) p.guardBreakFlash--;
    if (p.itemGetFlash > 0) p.itemGetFlash--;
    if (p.itemTimer > 0) { p.itemTimer--; if (p.itemTimer === 0) p.itemType = null; }

    // --- ガード（卵型シールド）---
    // 地上・卵が残っている・行動可能なときだけ展開。展開中は移動不可＆時間で縮む。
    p.guarding = cur.guard && canAct && p.onGround && p.guardHp > 0 && p.attackTimer === 0;
    if (p.guarding) {
      p.guardHp -= GUARD.drain;
      p.vx = 0;
      if (p.guardHp <= 0) {           // 時間切れで割れた
        p.guardHp = 0;
        p.guarding = false;
        p.guardBreakFlash = 20;
        p.hitstun = GUARD.breakStun;
        events.push({ type: "guardbreak", x: p.x, y: p.y - PLAYER_H / 2, slot: p.slot });
      }
    }
    const locked = p.guarding;        // ガード中は左右上下・攻撃すべて不可

    const dir = (canAct && !locked) ? ((cur.right ? 1 : 0) - (cur.left ? 1 : 0)) : 0;
    if (dir !== 0) p.facing = dir;

    // 水平移動（speedアイテムで1.5倍 / giantで1/2）
    const spd = p.itemType === "speed" ? ITEM.speedMult : p.itemType === "giant" ? GIANT.speedMult : 1;
    const maxRun = PHYS.maxRun * spd, maxAir = PHYS.maxAir * spd;
    if (p.onGround) {
      if (dir !== 0) {
        if (p.vx * dir < maxRun) {
          p.vx += PHYS.groundAccel * spd * dir;
          if (p.vx * dir > maxRun) p.vx = maxRun * dir;
        }
      } else {
        p.vx *= PHYS.friction;
        if (Math.abs(p.vx) < 0.05) p.vx = 0;
      }
    } else {
      if (dir !== 0) {
        if (p.vx * dir < maxAir) {
          p.vx += PHYS.airAccel * spd * dir;
          if (p.vx * dir > maxAir) p.vx = maxAir * dir;
        }
      } else {
        p.vx *= PHYS.airDrag;
      }
    }

    // ジャンプ（エッジ）。speedで1.5倍 / giantで高さ1/2（√0.5）
    const jumpEdge = cur.jump && !prev.jump;
    const jmul = p.itemType === "speed" ? ITEM.speedMult : p.itemType === "giant" ? GIANT.jumpMult : 1;
    if (jumpEdge && canAct && !locked) {
      if (p.onGround) {
        p.vy = PHYS.jumpVel * jmul;
        p.onGround = false;
      } else if (p.airJumps > 0) {
        p.vy = PHYS.doubleJumpVel * jmul;
        p.airJumps--;
      }
    }

    // すり抜け降下（薄い足場の上で下エッジ）
    const downEdge = cur.down && !prev.down;
    if (downEdge && canAct && !locked && p.onGround) {
      const plat = platformUnder(p, state.platforms);
      if (plat && plat.droppable) {
        p.onGround = false;
        p.dropTimer = 10;
        p.y += 2;
      }
    }

    // --- 復活風船: ふわふわ降下。Sキー(down)で割って任意に降りられる ---
    if (p.respawning) {
      if (cur.down) { p.respawning = false; events.push({ type: "respawn-pop", x: p.x, y: p.y - PLAYER_H - 20 }); }
      else {
        p.vy += (RESPAWN_FLOAT - p.vy) * 0.25;   // 一定の緩い降下速度へ寄せる
        p.onGround = false;
      }
    }

    // --- 風船（1ストック1回。押している間だけ浮上、燃料を使い切ると割れて復活まで無し）---
    p.ballooning = cur.balloon && canAct && !locked && !p.respawning && p.balloonFuel > 0;
    if (p.ballooning) {
      p.balloonFuel -= p.itemType === "giant" ? BALLOON.giantDrain : 1;  // 巨大化中は燃費2倍
      if (p.balloonFuel < 0) p.balloonFuel = 0;       // 奇数残量から2消費しても確実に0で割れる
      p.onGround = false;                             // 浮き上がる
      p.vy -= BALLOON.lift;                           // プカプカ上昇
      if (p.vy < -BALLOON.maxRise) p.vy = -BALLOON.maxRise;
      if (p.balloonFuel === 0) { p.ballooning = false; events.push({ type: "balloon-pop", x: p.x, y: p.y - PLAYER_H }); }
    }

    // 重力（風船中・復活降下中はスキップ。空中で下入力＝急降下）
    if (!p.onGround && !p.ballooning && !p.respawning) {
      const fast = cur.down && p.vy > 0;
      p.vy += fast ? PHYS.fastFallGravity : PHYS.gravity;
      const cap = fast ? PHYS.maxFastFall : PHYS.maxFall;
      if (p.vy > cap) p.vy = cap;
    }

    // --- 攻撃 / 必殺技チャージ ---
    // 攻撃ボタン押しっぱなしでチャージ。2秒(SPECIAL_CHARGE)で必殺技が自動発動。
    // 2秒未満で離すと通常攻撃。ガード中・攻撃硬直中はチャージしない。
    // 攻撃方向: 上下だけ入力しているときは上/下攻撃、それ以外は正面(左右)。
    const atkDir = ((cur.up || cur.down) && !cur.left && !cur.right) ? (cur.up ? "up" : "down") : "fwd";
    if (canAct && !locked && p.attackTimer === 0) {
      if (cur.attack) {
        p.chargeTimer++;
        if (p.chargeTimer >= SPECIAL_CHARGE) {
          p.attackTimer = SPECIAL.total;
          p.attackIsSpecial = true;
          p.attackDir = atkDir;
          p.attackVictims = [];
          p.chargeTimer = 0;
          events.push({ type: "special", x: p.x, y: p.y - PLAYER_H / 2, slot: p.slot });
        }
      } else {
        if (p.chargeTimer > 0) {       // 離した＝通常攻撃
          p.attackTimer = ATTACK.total;
          p.attackIsSpecial = false;
          p.attackDir = atkDir;
          p.attackVictims = [];
        }
        p.chargeTimer = 0;
      }
    } else if (!cur.attack) {
      p.chargeTimer = 0;
    }

    // 位置の積分 + 足場着地
    const prevY = p.y;
    p.x += p.vx;
    p.y += p.vy;

    if (p.vy >= 0) {
      let landed = false, bounced = false;
      for (const plat of state.platforms) {
        if (plat.droppable && p.dropTimer > 0) continue;
        if (plat.crumbleState === "gone") continue;   // 崩れて消えた床は乗れない
        if (p.x + pHW(p) <= plat.x || p.x - pHW(p) >= plat.x + plat.w) continue;
        if (prevY <= plat.y && p.y >= plat.y) {
          p.y = plat.y;
          if (plat.bounce) {                           // トランポリン: 上へ跳ねる
            p.vy = -plat.bounce; bounced = true; p.airJumps = PHYS.airJumps;
            events.push({ type: "bounce", x: p.x, y: plat.y, px: plat.x, pw: plat.w, strength: plat.bounce });
          } else {
            p.vy = 0; landed = true;
            if (plat.crumble && plat.crumbleState === "solid") { plat.crumbleState = "crack"; plat.crumbleTimer = CRUMBLE.crackTicks; }
          }
          break;
        }
      }
      if (landed) {
        if (!p.onGround) events.push({ type: "land", x: p.x, y: p.y });
        p.onGround = true;
        p.airJumps = PHYS.airJumps;
        p.respawning = false;                 // 着地したら復活風船おわり
      } else {
        p.onGround = false;
      }
    } else {
      p.onGround = false;
    }

    // 歩いているときの足のちょこちょこアニメ位相
    if (p.onGround && Math.abs(p.vx) > 0.4) p.stepPhase += Math.abs(p.vx) * 0.12;
    else p.stepPhase = 0;

    p.prev = cur;
  }

  // --- コンベア: 乗っているプレイヤーを流す ---
  for (const p of ps) {
    if (!p.alive || !p.onGround) continue;
    for (const plat of state.platforms) {
      if (!plat.conveyor) continue;
      if (Math.abs(p.y - plat.y) < 2 && p.x > plat.x && p.x < plat.x + plat.w) { p.x += plat.conveyor; break; }
    }
  }

  // --- 動く壁との当たり判定（横方向に押し出す）---
  if (state.walls.length) {
    for (const p of ps) {
      if (!p.alive) continue;
      for (const w of state.walls) {
        if (w.raise <= 0.02) continue;  // 下がって隠れている壁は素通り
        const pl = p.x - pHW(p), pr = p.x + pHW(p), pt = p.y - pH(p), pb = p.y;
        if (pr > w.x && pl < w.x + w.w && pb > w.top && pt < w.bottom) {
          const pushL = pr - w.x;                  // 左へ出る量
          const pushR = (w.x + w.w) - pl;          // 右へ出る量
          if (pushL < pushR) { p.x -= pushL; if (p.vx > 0) p.vx = 0; }
          else { p.x += pushR; if (p.vx < 0) p.vx = 0; }
        }
      }
    }
  }

  // --- 攻撃判定 ---
  for (let i = 0; i < ps.length; i++) {
    const a = ps[i];
    if (!a.alive) continue;
    const atk = a.attackIsSpecial ? SPECIAL : ATTACK;
    if (a.attackTimer > atk.activeFrom || a.attackTimer < atk.activeTo || a.attackTimer === 0) continue;
    // beamアイテム=長距離ビーム / reachアイテム=リーチ延長 / 通常
    const isBeam = a.itemType === "beam";
    const len = isBeam ? ITEM.beamRange : atk.range * (a.itemType === "reach" ? ITEM.reachMult : 1);
    const thickV = isBeam ? ITEM.beamThick : (PLAYER_W + 20);   // 上下攻撃の横幅
    const thickF = isBeam ? ITEM.beamThick : atk.height;        // 正面攻撃の厚み
    // 攻撃向き別のヒットボックス（fwd=前方 / up=頭上 / down=足元）。giantは体が大きいぶん基準も拡大
    const aHW = pHW(a), aH = pH(a);
    let hx, hy, hw, hh;
    if (a.attackDir === "up") {
      hw = thickV; hh = len;
      hx = a.x - hw / 2; hy = a.y - aH - len - 4;   // 頭上（頭より上に隙間）
    } else if (a.attackDir === "down") {
      hw = thickV; hh = len;
      hx = a.x - hw / 2; hy = a.y + 4;              // 足元（足より下）
    } else {
      hw = len; hh = thickF;
      hx = a.facing === 1 ? a.x + aHW - 6 : a.x - aHW - len + 6;
      hy = a.y - aH / 2 - thickF / 2 - 4;
    }
    for (let j = 0; j < ps.length; j++) {
      if (i === j) continue;
      const v = ps[j];
      if (!v.alive || v.invuln > 0 || a.attackVictims.includes(j)) continue;
      if (!rectsOverlap(hx, hy, hw, hh,
                        v.x - pHW(v), v.y - pH(v), pHW(v) * 2, pH(v))) continue;
      a.attackVictims.push(j);

      // ガードで防御中
      if (v.guarding && !atk.special) {
        // 通常攻撃は防げる：卵が減るだけ（ダメージ・ふっとばし無し）。小さく押される。
        v.guardHp -= GUARD.hitCost;
        v.vx = 1.5 * a.facing;
        state.hitstop = 4;
        if (v.guardHp <= 0) {
          v.guardHp = 0; v.guarding = false;
          v.guardBreakFlash = 20; v.hitstun = GUARD.breakStun;
          events.push({ type: "guardbreak", x: v.x, y: v.y - PLAYER_H / 2, slot: v.slot });
        } else {
          events.push({ type: "block", x: v.x + a.facing * 16, y: v.y - PLAYER_H / 2 });
        }
        continue;
      }
      // 必殺技はガードを一撃で粉砕して当たる
      if (v.guarding && atk.special) {
        v.guardHp = 0; v.guarding = false; v.guardBreakFlash = 24;
        events.push({ type: "guardbreak", x: v.x, y: v.y - PLAYER_H / 2, slot: v.slot });
      }

      // ヒット（通常/必殺共通、角度45度上方向）。giantはパワー4倍
      v.damage += atk.damage;
      a.damageDealt += atk.damage;   // スコア: 与えたダメージを加算
      const powerMult = a.itemType === "giant" ? GIANT.powerMult : 1;
      const kb = (atk.kbBase + v.damage * atk.kbScale) * powerMult;
      const rad = atk.angleDeg * Math.PI / 180;
      v.vx = Math.cos(rad) * kb * a.facing;
      v.vy = -Math.sin(rad) * kb;
      v.hitstun = Math.floor(4 + kb * 2.0);
      v.onGround = false;
      v.hitFlash = 8;
      v.chargeTimer = 0;             // 被弾でチャージ中断
      v.attackTimer = 0;
      v.attackIsSpecial = false;
      state.hitstop = atk.hitstopFrames;
      events.push({ type: atk.special ? "special-hit" : "hit", x: (a.x + v.x) / 2, y: v.y - PLAYER_H / 2, dir: a.facing, dmg: v.damage });
    }
  }

  // --- アイテム（出現・落下・取得）---
  if (!inCountdown && !state.ending) {
    // 出現（reach/speed/beam=各weight2、refill=weight1＝半分の頻度）
    if (state.itemTimer > 0) state.itemTimer--;
    if (state.itemTimer === 0) {
      state.itemTimer = ITEM.spawnInterval;
      if (state.items.length < ITEM.maxOnField) {
        // reach/speed/beam/giant=各weight2、refill=weight1（半分の頻度）
        const roll = rngNext(state) * 9;
        const type = roll < 2 ? "reach" : roll < 4 ? "speed" : roll < 6 ? "beam" : roll < 8 ? "giant" : "refill";
        if (type === "refill") {
          // 風船なのでふわふわ浮いて、風で左右に流れて横切る
          const dir = rngNext(state) < 0.5 ? 1 : -1;
          const y = 170 + rngNext(state) * 170;
          const x = dir > 0 ? -24 : W + 24;
          state.items.push({ type, x, y, vy: 0, vx: dir * (0.9 + rngNext(state) * 0.7), float: true, landed: false });
          events.push({ type: "item-spawn", x, itemType: type });
        } else {
          const margin = 160;
          const x = margin + rngNext(state) * (W - margin * 2);
          state.items.push({ type, x, y: -30, vy: 0, landed: false });
          events.push({ type: "item-spawn", x, itemType: type });
        }
      }
    }
    // 落下＋設置 / 風船はふわふわ横流れ
    for (const it of state.items) {
      if (it.float) { it.x += it.vx; continue; }   // 風船アイテムは水平ドリフト（上下バブは描画で）
      if (!it.landed) {
        it.vy += ITEM.gravity;
        if (it.vy > ITEM.maxFall) it.vy = ITEM.maxFall;
        const prevY = it.y;
        it.y += it.vy;
        for (const plat of state.platforms) {
          if (it.x <= plat.x || it.x >= plat.x + plat.w) continue;
          if (prevY <= plat.y && it.y >= plat.y) {
            it.y = plat.y - ITEM.radius; it.vy = 0; it.landed = true;
            events.push({ type: "item-land", x: it.x, y: it.y });
            break;
          }
        }
      }
    }
    // 取得（落下中でも先に触れた方が取る）＋ 画面外で消滅
    for (let k = state.items.length - 1; k >= 0; k--) {
      const it = state.items[k];
      if (it.float && (it.x < -50 || it.x > W + 50)) { state.items.splice(k, 1); continue; }
      if (!it.float && it.y > BLAST.bottom) { state.items.splice(k, 1); continue; }
      let taken = -1;
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        if (!p.alive) continue;
        if (rectsOverlap(it.x - ITEM.radius, it.y - ITEM.radius, ITEM.radius * 2, ITEM.radius * 2,
                         p.x - pHW(p), p.y - pH(p), pHW(p) * 2, pH(p))) {
          taken = i; break;
        }
      }
      if (taken >= 0) {
        const p = ps[taken];
        if (it.type === "refill") {
          p.balloonFuel = BALLOON.fuel;   // 風船ゲージを満タンに（即時）
        } else {
          p.itemType = it.type;
          p.itemTimer = ITEM.duration[it.type];
        }
        p.itemGetFlash = 24;
        state.items.splice(k, 1);
        events.push({ type: "item-get", x: p.x, y: p.y - PLAYER_H, slot: p.slot, itemType: it.type });
      }
    }
  }

  // --- ハザード類（うごく床のモブ / 振り子 / 溶岩 / ワープ）---
  if (!inCountdown && !state.ending) {
    updateMob(state, events);
    if (state.pendulums.length) updatePendulums(state, events);
    if (state.lava.length) updateLava(state, events);
    if (state.warps.length) updateWarps(state, events);
  }

  // --- 場外KO ---
  for (const p of ps) {
    if (!p.alive) continue;
    if (p.x < BLAST.left || p.x > BLAST.right || p.y < BLAST.top || p.y > BLAST.bottom) {
      p.stocks--;
      // 撃墜方向（画面のどの辺から出たか）を派手エフェクト用に伝える
      const koDir = p.x < 0 ? "L" : p.x > W ? "R" : p.y < 0 ? "U" : "D";
      events.push({ type: "ko", slot: p.slot, x: Math.max(40, Math.min(W - 40, p.x)), y: Math.max(40, Math.min(H - 40, p.y)), dir: koDir });
      if (p.stocks > 0) {
        const sp = state.stage.spawns[p.slot];
        p.x = sp.x; p.y = RESPAWN_TOP;         // 画面上部から
        p.vx = 0; p.vy = 0;
        p.damage = 0;
        p.hitstun = 0; p.attackTimer = 0; p.attackIsSpecial = false;
        p.chargeTimer = 0;
        p.guardHp = GUARD.max; p.guarding = false; p.guardBreakFlash = 0;  // 卵は復活で全回復
        p.itemType = null; p.itemTimer = 0;                                // アイテム効果もリセット
        p.balloonFuel = BALLOON.fuel; p.ballooning = false;                // 風船も復活で回復
        p.warpCd = 0;
        p.airJumps = PHYS.airJumps;
        p.invuln = RESPAWN_INVULN;
        p.respawning = true;                   // 復活風船でふわふわ降下
        p.onGround = false;
      } else {
        p.alive = false;
      }
    }
  }

  // --- 時間切れ（2分）---
  if (!inCountdown && !state.ending && state.timeLeft > 0) {
    if (--state.timeLeft <= 0) {
      state.ending = true; state.timeUp = true; state.endTimer = 90;
      state.winnerSlot = decideByScore(ps);
      events.push({ type: "finish" });
    }
  }

  // --- 決着判定（生き残り）---
  if (!state.ending) {
    const alive = ps.filter(p => p.alive);
    if (alive.length <= 1) {
      state.ending = true;
      state.endTimer = 70;
      state.winnerSlot = alive.length === 1 ? alive[0].slot : null;
      events.push({ type: "finish" });
    }
  } else if (state.endTimer > 0) {
    state.endTimer--;
    if (state.endTimer === 0) state.finished = true;
  }

  return events;
}

// リザルト用の情報（勝者＋各プレイヤーのスコア）を作る
function buildResultInfo(m) {
  return {
    winnerSlot: m.winnerSlot,
    timeUp: !!m.timeUp,
    scores: m.players.map(p => ({ slot: p.slot, dealt: Math.floor(p.damageDealt), stocks: Math.max(0, p.stocks), taken: Math.floor(p.damage) })),
  };
}

// 時間切れ時の順位付け: ストック多い＞与ダメージ多い＞被ダメージ少ない。並びは同点=引き分け
function decideByScore(ps) {
  let bestSlot = null, bestKey = -Infinity, tie = false;
  for (const p of ps) {
    const key = p.stocks * 1e9 + p.damageDealt * 1000 - Math.floor(p.damage);
    if (key > bestKey) { bestKey = key; bestSlot = p.slot; tie = false; }
    else if (key === bestKey) tie = true;
  }
  return tie ? null : bestSlot;
}

function platformUnder(p, platforms) {
  for (const plat of platforms) {
    if (p.y === plat.y &&
        p.x + pHW(p) > plat.x && p.x - pHW(p) < plat.x + plat.w) {
      return plat;
    }
  }
  return null;
}

/* ==================== アプリ状態（ロビー等） ==================== */

const APP = {
  phase: "lobby",           // lobby | match | result
  mode: "local",            // local | online
  slots: [null, null, null, null],   // {source} を格納
  match: null,
  stageIndex: 0,            // ロビーで選択中のステージ
  soloSlot: -1,             // 人間1人(ソロ)のときその人のslot（オンライン操作を使う）
  lobbyPrev: new Map(),     // sourceId -> 前フレームsample（参加検出用）
  resultInfo: null,
};
window.APP = APP;  // デバッグ用に公開

/* ==================== オンライン対戦（2人・入力同期lockstep） ====================
 * 方式: delay-based lockstep
 *  - 両クライアントが同一の決定論的sim(stepMatch)を実行する
 *  - 送るのは毎tickの入力(1バイト)だけ。tick Tの実行には両者の入力[T]が必須
 *  - 自分の入力は「tick T実行時に T+DELAY 分を生成して送信」→ DELAY tick先で反映
 *  - 相手の入力が未着ならそのtickは待つ(stall)。届き次第追いつく
 * 接続: PeerJS(P2P)。ホストが部屋コードを発行、参加側がコードで接続 */
// 星型トポロジー（最大4人）: ホスト=player0、参加者=1..3。
//   ・各クライアントは自分の入力だけ生成し、tick T+DELAY 分をホストへ送る
//   ・ホストは全員の入力を集約し、各参加者へ他プレイヤーの入力を中継（broadcast）
//   ・全員の入力[T]が揃ったら決定論simを1歩進める（揃うまでstall）
const NET = {
  peer: null, isHost: false, code: null,
  hostConn: null,          // 参加側: ホストへの接続
  conns: [],               // ホスト側: [{conn, idx}]
  myIndex: 0,              // このクライアントのプレイヤー番号
  numPlayers: 2,
  dropped: new Set(),      // 途中退出したプレイヤー番号（以降NEUTRAL扱い）
  status: "idle",   // idle | starting | hosting | joining | connected
  msg: "",
  gen: 0,           // 試合世代（前試合の残留inputを弾く）
  DELAY: 4,         // 入力遅延tick（60fpsで約67ms）
  buffers: [],      // [player][tick] の入力バッファ
  stall: 0,
  resultPrev: false,
};

function encodeSample(s) {
  return (s.left?1:0)|(s.right?2:0)|(s.up?4:0)|(s.down?8:0)|(s.jump?16:0)|(s.attack?32:0)|(s.guard?64:0)|(s.balloon?128:0);
}
function decodeSample(b) {
  return { left:!!(b&1), right:!!(b&2), up:!!(b&4), down:!!(b&8), jump:!!(b&16), attack:!!(b&32), guard:!!(b&64), balloon:!!(b&128), start:false };
}

// オンライン時のキー配置（1人が片手で移動WASD/矢印、もう片手でJ/K/Space）
//   移動: WASD または 矢印（従来通り） / ジャンプ: W・↑ / 急降下: S・↓
//   攻撃: J（長押し2秒で必殺技） / 防御(卵ガード): K / 風船: Space
//   ゲームパッドも併用可
function sampleLocalMerged() {
  const k = keys;
  const gpBtn = (list) => { const ps=navigator.getGamepads(); for(let i=0;i<ps.length;i++){ const g=ps[i]; if(g&&list.some(b=>g.buttons[b]&&g.buttons[b].pressed)) return true; } return false; };
  const gpAxis = (ax, lo) => { const ps=navigator.getGamepads(); for(let i=0;i<ps.length;i++){ const g=ps[i]; if(!g)continue; const v=g.axes[ax]||0; if(lo?v<-0.4:v>0.4) return true; const dpad = ax===0?(lo?14:15):(lo?12:13); if(g.buttons[dpad]&&g.buttons[dpad].pressed) return true; } return false; };
  const up = k.has("KeyW") || k.has("ArrowUp") || gpBtn([0,1]);
  return {
    left:  k.has("KeyA") || k.has("ArrowLeft")  || gpAxis(0, true),
    right: k.has("KeyD") || k.has("ArrowRight") || gpAxis(0, false),
    up,
    down:  k.has("KeyS") || k.has("ArrowDown")  || gpAxis(1, false),
    jump:  up,
    attack: k.has("KeyJ") || gpBtn([2]),        // オンライン攻撃 = J
    guard:  k.has("KeyK") || gpBtn([4,5,6,7]),  // オンライン防御 = K
    balloon: k.has("Space") || gpBtn([3]),      // オンライン風船 = Space
    start: k.has("Enter"),
  };
}

function netResetBuffers(n) {
  NET.buffers = [];
  for (let i = 0; i < n; i++) {
    NET.buffers[i] = [];
    for (let t = 0; t < NET.DELAY; t++) NET.buffers[i][t] = NEUTRAL;
  }
}

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function makeCode() {
  let s = "";
  for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}
const peerIdFor = code => "uchisuma-" + code;

function connectedCount() { return 1 + NET.conns.length; }  // ホスト含む人数

function netHost() {
  netCleanup();
  NET.isHost = true; NET.myIndex = 0; NET.code = makeCode();
  NET.conns = []; NET.dropped = new Set();
  NET.status = "starting"; NET.msg = "サーバー接続中…";
  refreshOnlineUI();
  const peer = new Peer(peerIdFor(NET.code));
  NET.peer = peer;
  peer.on("open", () => { NET.status = "hosting"; NET.msg = ""; refreshOnlineUI(); });
  peer.on("connection", conn => {
    if (NET.conns.length >= 3 || APP.phase === "match") { conn.close(); return; }  // 満員/試合中は拒否
    const idx = NET.conns.length + 1;   // 参加順に 1,2,3
    const entry = { conn, idx };
    NET.conns.push(entry);
    conn.on("open", () => {
      conn.send({ y: "welcome", idx });
      NET.status = "connected"; NET.msg = ""; refreshOnlineUI();
    });
    conn.on("data", d => netHostOnData(d, entry));
    conn.on("close", () => netHostConnClosed(entry));
  });
  peer.on("error", e => { NET.status = "idle"; NET.msg = "エラー: " + e.type; refreshOnlineUI(); });
}

function netJoin(code) {
  if (!code || code.length !== 4) { NET.msg = "4文字のコードを入れてください"; refreshOnlineUI(); return; }
  netCleanup();
  NET.isHost = false; NET.myIndex = 1; NET.code = code;
  NET.conns = []; NET.dropped = new Set();
  NET.status = "joining"; NET.msg = "接続中…";
  refreshOnlineUI();
  const peer = new Peer();
  NET.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect(peerIdFor(code), { reliable: true, serialization: "json" });
    NET.hostConn = conn;
    conn.on("open", () => { NET.status = "connected"; NET.msg = ""; refreshOnlineUI(); });
    conn.on("data", netGuestOnData);
    conn.on("close", () => {
      NET.hostConn = null;
      NET.status = "idle"; NET.msg = "ホストとの接続が切れました";
      if (APP.mode === "online") { APP.match = null; APP.mode = "local"; APP.phase = "lobby"; openOnlineMenu(); }
      refreshOnlineUI();
    });
  });
  peer.on("error", e => { NET.status = "idle"; NET.msg = "エラー: " + e.type + "（コード間違い？）"; refreshOnlineUI(); });
}

// ホスト: 参加者からのデータ受信
function netHostOnData(d, entry) {
  if (!d || !d.y) return;
  if (d.y === "i") {
    if (d.g !== NET.gen) return;
    NET.buffers[d.p] && (NET.buffers[d.p][d.t] = decodeSample(d.b));
    // 他の参加者へ中継
    for (const e of NET.conns) if (e !== entry && e.conn.open) e.conn.send(d);
  }
}

function netHostConnClosed(entry) {
  const i = NET.conns.indexOf(entry);
  if (i >= 0) NET.conns.splice(i, 1);
  if (APP.phase === "match" || APP.phase === "result") {
    // 試合中の退出: そのプレイヤーは以降NEUTRAL扱い、他へも通知
    NET.dropped.add(entry.idx);
    for (const e of NET.conns) if (e.conn.open) e.conn.send({ y: "drop", p: entry.idx });
    NET.msg = "P" + (entry.idx + 1) + " が退出しました";
  } else {
    NET.status = NET.peer ? "hosting" : "idle";
  }
  refreshOnlineUI();
}

// 参加者: ホストからのデータ受信
function netGuestOnData(d) {
  if (!d || !d.y) return;
  if (d.y === "welcome") {
    NET.myIndex = d.idx;
  } else if (d.y === "i") {
    if (d.g === NET.gen && NET.buffers[d.p]) NET.buffers[d.p][d.t] = decodeSample(d.b);
  } else if (d.y === "start") {
    NET.gen = d.g;
    startOnlineMatch(d.st | 0, d.n | 0);
  } else if (d.y === "drop") {
    NET.dropped.add(d.p);
    NET.msg = "P" + (d.p + 1) + " が退出しました";
  } else if (d.y === "stagesel") {
    NET.remoteStage = d.st | 0;   // ホストが選んだ次ステージ（表示用）
  }
}

function netHostStart() {
  if (!(NET.isHost && NET.status === "connected" && NET.conns.length >= 1)) return;
  NET.gen++;
  const n = connectedCount();
  for (const e of NET.conns) if (e.conn.open) e.conn.send({ y: "start", g: NET.gen, st: APP.stageIndex, n });
  startOnlineMatch(APP.stageIndex, n);
}

function startOnlineMatch(stageIndex, numPlayers) {
  const n = Math.max(2, Math.min(4, numPlayers | 0));
  NET.numPlayers = n;
  NET.dropped = new Set();
  netResetBuffers(n);
  NET.stall = 0; NET.resultPrev = true;
  const slots = []; for (let i = 0; i < n; i++) slots.push(i);
  APP.match = makeMatchState(slots, stageIndex);   // ホスト=P1, 参加順にP2,P3,P4
  APP.mode = "online"; APP.phase = "match";
  document.getElementById("online").hidden = true;
}

function netLeaveToMenu() {
  netCleanup();
  APP.match = null; APP.mode = "local"; APP.phase = "lobby";
  openOnlineMenu();
}

function netCleanup() {
  for (const e of NET.conns) { try { e.conn.close(); } catch (err) {} }
  NET.conns = [];
  if (NET.hostConn) { try { NET.hostConn.close(); } catch (e) {} NET.hostConn = null; }
  if (NET.peer) { try { NET.peer.destroy(); } catch (e) {} NET.peer = null; }
  NET.status = "idle"; NET.msg = "";
}

// 自分の入力を送信（参加者→ホスト / ホスト→全参加者）
function netSendInput(t, sample) {
  const msg = { y: "i", g: NET.gen, t, b: encodeSample(sample), p: NET.myIndex };
  if (NET.isHost) { for (const e of NET.conns) if (e.conn.open) e.conn.send(msg); }
  else if (NET.hostConn && NET.hostConn.open) NET.hostConn.send(msg);
}

// 1tick分のオンライン処理: 入力生成→送信→全員の入力が揃っていればsimを1歩進める
function updateOnlineMatch() {
  const m = APP.match;
  if (!m) return;
  const my = NET.myIndex, n = NET.numPlayers;

  const genTick = m.tick + NET.DELAY;
  if (NET.buffers[my] && !NET.buffers[my][genTick]) {
    const s = sampleLocalMerged();
    NET.buffers[my][genTick] = s;
    netSendInput(genTick, s);
  }

  // 全員の入力[tick]が揃ったか（退出者はNEUTRAL）
  const inputs = []; let ready = true;
  for (let i = 0; i < n; i++) {
    if (NET.dropped.has(i)) { inputs[i] = NEUTRAL; continue; }
    const b = NET.buffers[i] && NET.buffers[i][m.tick];
    if (b) inputs[i] = b; else { ready = false; break; }
  }
  if (ready) {
    NET.stall = 0;
    handleEvents(stepMatch(m, inputs));
  } else {
    NET.stall++;
  }

  if (m.finished) {
    APP.resultInfo = buildResultInfo(m);
    APP.phase = "result";
    NET.resultPrev = true;
  }
  if (keys.has("Escape")) {
    keys.delete("Escape");
    netLeaveToMenu();
  }
}

/* --- オンラインメニューUI（DOMオーバーレイ） --- */
const $ol = id => document.getElementById(id);

function openOnlineMenu() {
  $ol("online").hidden = false;
  refreshOnlineUI();
}

function refreshOnlineUI() {
  const idle = $ol("ol-idle"), room = $ol("ol-room");
  const codeView = $ol("ol-code-view"), share = $ol("ol-share");
  const roomMsg = $ol("ol-room-msg"), btnStart = $ol("btn-start");
  idle.hidden = !(NET.status === "idle" || NET.status === "starting" || NET.status === "joining");
  room.hidden = !(NET.status === "hosting" || NET.status === "connected");
  $ol("btn-host").disabled = $ol("btn-join").disabled = (NET.status === "starting" || NET.status === "joining");
  if (!room.hidden) {
    codeView.textContent = NET.code || "";
    share.textContent = NET.isHost ? (location.origin + location.pathname + "?room=" + NET.code) : "";
    const count = NET.isHost ? connectedCount() : null;
    if (NET.status === "hosting") {
      roomMsg.textContent = "友だちの参加を待っています（最大4人）… コード/URLを伝えてください";
      btnStart.hidden = true;
    } else if (NET.status === "connected") {
      if (NET.isHost) {
        roomMsg.textContent = "接続: " + count + "人（あなた=P1）。ステージを選んで開始！ さらに参加も待てます";
        btnStart.hidden = count < 2;
      } else {
        roomMsg.textContent = "接続完了（あなた=P" + (NET.myIndex + 1) + "）。ホストの開始を待っています…";
        btnStart.hidden = true;
      }
    }
    // ステージ選択はホストのみ（接続後）
    const stageBox = $ol("ol-stage");
    stageBox.hidden = !(NET.isHost && NET.status === "connected");
    $ol("ol-stage-name").textContent = STAGES[APP.stageIndex].name;
    // コピーボタンはホストのみ
    $ol("btn-copy-code").style.display = NET.isHost ? "" : "none";
    $ol("btn-copy-url").style.display = NET.isHost ? "" : "none";
  }
  $ol("ol-status").textContent = NET.msg || "";
}

function olChangeStage(delta) {
  APP.stageIndex = ((APP.stageIndex + delta) % STAGES.length + STAGES.length) % STAGES.length;
  refreshOnlineUI();
}
$ol("ol-stage-prev").addEventListener("click", () => olChangeStage(-1));
$ol("ol-stage-next").addEventListener("click", () => olChangeStage(1));

// コード/URLをクリップボードへコピー（フォールバック付き）
function copyText(text, btn) {
  const done = () => { const o = btn.textContent; btn.textContent = "コピーしました✓"; setTimeout(() => { btn.textContent = o; }, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function allCandidateSources() {
  const list = [makeKeyboardSource(0), makeKeyboardSource(1)];
  const pads = navigator.getGamepads();
  for (let i = 0; i < pads.length; i++) {
    if (pads[i]) list.push(makeGamepadSource(i));
  }
  return list;
}

function claimedIds() {
  return APP.slots.filter(Boolean).map(s => s.source.id);
}

function updateLobby() {
  // オンラインメニューを開いている間はローカルロビー操作（参加/CPU/ステージ）を止める
  if (!$ol("online").hidden) return;
  // 注意: 全ソースの prev を先に更新しきってから遷移する
  // （ループ途中で抜けると未更新の prev が偽エッジを生む）
  const claimed = claimedIds();
  let wantStart = false, stageDelta = 0;
  for (const src of allCandidateSources()) {
    const cur = src.sample();
    const prev = APP.lobbyPrev.get(src.id) || NEUTRAL;
    APP.lobbyPrev.set(src.id, cur);
    const attackEdge = cur.attack && !prev.attack;
    if (attackEdge && !claimed.includes(src.id)) {
      const free = APP.slots.findIndex(s => s === null);
      if (free !== -1) {
        APP.slots[free] = { source: src };
        claimed.push(src.id);
      }
    }
    // 左右入力でステージ選択（誰の入力でもOK）
    if (cur.left && !prev.left) stageDelta--;
    if (cur.right && !prev.right) stageDelta++;
    if (cur.start && !prev.start) wantStart = true;  // Enter or パッドStart
  }
  if (stageDelta !== 0) {
    APP.stageIndex = ((APP.stageIndex + stageDelta) % STAGES.length + STAGES.length) % STAGES.length;
  }
  // C=CPU追加 / X=CPU削除（エッジ検出）
  if (keys.has("KeyC") && !APP._prevC) {
    const free = APP.slots.findIndex(s => s === null);
    if (free !== -1) APP.slots[free] = { source: makeCpuSource(), cpu: true };
  }
  APP._prevC = keys.has("KeyC");
  if (keys.has("KeyX") && !APP._prevX) {
    for (let i = APP.slots.length - 1; i >= 0; i--) {
      if (APP.slots[i] && APP.slots[i].cpu) { APP.slots[i] = null; break; }
    }
  }
  APP._prevX = keys.has("KeyX");
  if (wantStart && APP.slots.filter(Boolean).length >= 2) startMatch();
}

function startMatch() {
  const slotIndices = [];
  APP.slots.forEach((s, i) => { if (s) slotIndices.push(i); });
  // 人間が1人だけ（ソロ）なら、その人はオンラインと同じキー操作(J攻撃/K防御/Space風船)にする
  const humans = [];
  APP.slots.forEach((s, i) => { if (s && !s.cpu) humans.push(i); });
  APP.soloSlot = humans.length === 1 ? humans[0] : -1;
  APP.match = makeMatchState(slotIndices, APP.stageIndex);
  APP.phase = "match";
}

function updateMatch() {
  if (APP.mode === "online") { updateOnlineMatch(); return; }
  const m = APP.match;
  const samples = m.players.map(p =>
    p.slot === APP.soloSlot ? sampleLocalMerged() : APP.slots[p.slot].source.sample(p.slot, m));
  const events = stepMatch(m, samples);
  handleEvents(events);

  if (m.finished) {
    APP.resultInfo = buildResultInfo(m);
    APP.phase = "result";
    APP.lobbyPrev.clear();
  }
  if (keys.has("Escape")) {
    APP.phase = "lobby";
    APP.match = null;
    APP.lobbyPrev.clear();
    keys.delete("Escape");
  }
}

function changeStage(delta) {
  APP.stageIndex = ((APP.stageIndex + delta) % STAGES.length + STAGES.length) % STAGES.length;
}

function updateResult() {
  if (APP.mode === "online") {
    // ホスト: 左右でステージ変更／Enterで再戦（選択中ステージ）。参加側: 待つ。Esc: 退出
    if (NET.isHost) {
      const l = keys.has("KeyA") || keys.has("ArrowLeft");
      const r = keys.has("KeyD") || keys.has("ArrowRight");
      if (l && !NET._prevL) { changeStage(-1); olBroadcastStage(); }
      if (r && !NET._prevR) { changeStage(1); olBroadcastStage(); }
      NET._prevL = l; NET._prevR = r;
      const enter = keys.has("Enter");
      if (enter && !NET.resultPrev) netHostStart();   // netHostStart は APP.stageIndex を使う
      NET.resultPrev = enter;
    }
    if (keys.has("Escape")) { keys.delete("Escape"); netLeaveToMenu(); }
    return;
  }
  // ローカル: 左右でステージ変更／Enter で同じ顔ぶれのまま再戦／Esc でロビーへ
  let wantRematch = false, stageDelta = 0;
  for (const src of allCandidateSources()) {
    const cur = src.sample();
    const prev = APP.lobbyPrev.get(src.id) || NEUTRAL;
    APP.lobbyPrev.set(src.id, cur);
    if (cur.start && !prev.start) wantRematch = true;
    if (cur.left && !prev.left) stageDelta--;
    if (cur.right && !prev.right) stageDelta++;
  }
  if (stageDelta) changeStage(stageDelta);
  if (keys.has("Escape")) { keys.delete("Escape"); APP.phase = "lobby"; APP.match = null; return; }
  if (wantRematch) startMatch();   // 顔ぶれそのまま、選択中ステージで再戦
}

// ホストが選んだ次ステージを参加者へ通知（表示用）
function olBroadcastStage() {
  for (const e of NET.conns) if (e.conn.open) e.conn.send({ y: "stagesel", st: APP.stageIndex });
}

/* ==================== 演出（非決定でOKな層） ==================== */

const fx = { particles: [], shake: 0, koFlash: 0, tramp: {}, rings: [], koLabel: null };  // tramp: 床x→ビヨン揺れ

function handleEvents(events) {
  for (const ev of events) {
    if (ev.type === "hit") {
      fx.shake = Math.min(10, 4 + ev.dmg * 0.03);
      for (let k = 0; k < 10; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() * 6 + 2) * ev.dir + (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.7) * 8,
          life: 18 + Math.random() * 10,
          size: 3 + Math.random() * 3,
          color: "#fff",
        });
      }
    } else if (ev.type === "ko") {
      fx.shake = 22;
      fx.koFlash = 22;
      fx.rings.push({ x: ev.x, y: ev.y, t: 0, color: COLORS[ev.slot] });
      fx.koLabel = { slot: ev.slot, t: 55 };
      // 全方位バースト（大きめ・多め）
      for (let k = 0; k < 44; k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 3 + Math.random() * 12;
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          life: 26 + Math.random() * 18,
          size: 4 + Math.random() * 5,
          color: Math.random() < 0.4 ? "#fff" : COLORS[ev.slot],
        });
      }
      // 撃墜方向へ飛ぶ星の尾（L/R/U/D）
      const dv = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] }[ev.dir] || [0, -1];
      for (let k = 0; k < 12; k++) {
        const sp = 8 + Math.random() * 12;
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: dv[0] * sp + (Math.random() - 0.5) * 4, vy: dv[1] * sp + (Math.random() - 0.5) * 4,
          life: 20 + Math.random() * 12, size: 3 + Math.random() * 4, color: "#ffe680",
        });
      }
    } else if (ev.type === "respawn-pop") {
      for (let k = 0; k < 10; k++) {
        const ang = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
        fx.particles.push({ x: ev.x, y: ev.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 12 + Math.random() * 6, size: 2 + Math.random() * 2, color: "#cfe8ff" });
      }
    } else if (ev.type === "land") {
      for (let k = 0; k < 4; k++) {
        fx.particles.push({
          x: ev.x + (Math.random() - 0.5) * 24, y: ev.y,
          vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 1.5,
          life: 10 + Math.random() * 6,
          size: 2 + Math.random() * 2,
          color: "#8a8aa0",
        });
      }
    } else if (ev.type === "special-hit") {
      fx.shake = 16;
      fx.koFlash = 8;
      for (let k = 0; k < 22; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() * 9 + 3) * ev.dir + (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.7) * 12,
          life: 22 + Math.random() * 14,

        });
      }
    } else if (ev.type === "special") {
      fx.shake = 6;   // チャージ完了フラッシュ
    } else if (ev.type === "block") {
      for (let k = 0; k < 6; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,

        });
      }
    } else if (ev.type === "guardbreak") {
      fx.shake = 10;
      for (let k = 0; k < 20; k++) {   // 卵の殻が割れて飛び散る

        const sp = 2 + Math.random() * 7;

          x: ev.x, y: ev.y,

      }
    } else if (ev.type === "item-get") {
      fx.shake = 4;
      const col = (ITEM_STYLE[ev.itemType] && ITEM_STYLE[ev.itemType].color) || "#fff";
      for (let k = 0; k < 16; k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        fx.particles.push({
          x: ev.x, y: ev.y,

      }
    } else if (ev.type === "balloon-pop") {
