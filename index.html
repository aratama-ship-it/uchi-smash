</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>

<div id="online" hidden>
  <div class="panel">

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
/* =====================================================================
 * ウチスマ！β — 身内向けスマブラ風 2D対戦ゲーム
 *
 * 設計方針（オンライン化を見据えた焼き込み）:
 *  1. 最大4人をアーキテクチャに固定
 *  2. 「入力ソース」抽象化: キーボード2系統 + ゲームパッド + (将来)ネットワーク
 *     すべて同じ InputSample {left,right,up,down,jump,attack,start} を返す
 *  3. シミュレーションは決定論的:
 *     stepMatch(state, samples[]) は「状態 + 今フレームの全員の入力」だけで
 *     次の状態が決まる。乱数・時刻・描画に依存しない。
 *     → 将来のオンライン化(入力同期方式)でこの関数をそのまま使える
 *  4. 描画・パーティクル・画面揺れは sim が返すイベントから生成（非決定でOK）
 * ===================================================================== */

/* ============================ 定数 ============================ */
const W = 1280, H = 720;

// ガード（卵型シールド）: 使うと縮む（被弾＋時間経過）。使い切ったら復活まで終わり。
//   ガード中は移動不可。通常攻撃は防げるが必殺技は一撃で割れる。
const GUARD = {
  max: 100,
  drain: 0.55,     // 展開中の毎tick減少（約3秒でゼロ）
  hitCost: 40,     // 通常攻撃を防いだ時の減少量

};

const PLAYER_W = 36, PLAYER_H = 48;
const STOCKS = 3;
const RESPAWN_INVULN = 150;
const COUNTDOWN_TICKS = 180;

// アイテム: 空からステージ上へ落下。先にタッチした人が取得、効果は10秒。
//   reach = 攻撃(波動)のリーチ延長 / speed = 移動速度1.5倍
//   ⚠️ 落下位置・種類・タイミングは決定論的PRNG(state.rng)で決める→オンライン同期維持
const ITEM = {
  duration: { reach: 300, speed: 600 },  // 効果時間: reach=5秒 / speed=10秒
  spawnInterval: 480,   // 出現間隔（8秒ごと）
  firstSpawn: 240,      // 最初の出現（4秒後）
  maxOnField: 2,        // 同時に落ちている上限
  radius: 18,
  gravity: 0.3,
  maxFall: 6,
  reachMult: 1.8,       // reach効果: リーチ倍率
  speedMult: 1.5,       // speed効果: 移動速度＆ジャンプ力倍率
};
const ITEM_TYPES = ["reach", "speed"];

const BLAST = { left: -250, right: W + 250, top: -350, bottom: H + 330 };

// ============================ ステージ ============================
// platforms: 全て上からのみ乗れる（droppable=薄い足場で下からすり抜け・降下可、
//            main=分厚い地面）。spawns: 4人ぶんの初期位置（足元y）。
// theme: 背景/地面/足場の配色。
// ⚠️ 段差の設計基準: 単発ジャンプ最高到達点≈134px。隣接足場の縦間隔は≤110pxに。
const STAGES = [
  {
    name: "ひろば",
    theme: { sky:["#232343","#31315a","#3d3d6b"], mountain:"rgba(30,30,60,0.8)",
             dirt:"#4a3728", grass:"#6dbb52", grass2:"#59a041", plat:"#8a7a9a", platTop:"#a99cc0" },
    platforms: [
      { x: 190, y: 560, w: 900, droppable: false, main: true },
      { x: 300, y: 455, w: 180, droppable: true },
      { x: 800, y: 455, w: 180, droppable: true },
      { x: 550, y: 350, w: 180, droppable: true },
    ],
    spawns: [ {x:390,y:455}, {x:890,y:455}, {x:420,y:560}, {x:860,y:560} ],
  },
  {
    name: "ふたご島",
    theme: { sky:["#16283a","#1e4a6a","#2a6a8a"], mountain:"rgba(20,60,90,0.6)",
             dirt:"#6a5a3a", grass:"#d8c088", grass2:"#b8a068", plat:"#5a8a9a", platTop:"#7aaaba" },
    platforms: [
      { x: 130, y: 555, w: 400, droppable: false, main: true },
      { x: 750, y: 555, w: 400, droppable: false, main: true },
      { x: 520, y: 410, w: 240, droppable: true },
    ],
    spawns: [ {x:300,y:555}, {x:950,y:555}, {x:600,y:410}, {x:680,y:410} ],
  },
  {
    name: "とう（縦長）",
    theme: { sky:["#2a2438","#3a3050","#4a4068"], mountain:"rgba(35,30,55,0.75)",
             dirt:"#4a4048", grass:"#9a8ab0", grass2:"#7a6a90", plat:"#8a7a9a", platTop:"#aa9aba" },
    platforms: [
      { x: 300, y: 600, w: 680, droppable: false, main: true },
      { x: 360, y: 500, w: 220, droppable: true },   // 左（横重なり十分）
      { x: 700, y: 500, w: 220, droppable: true },   // 右
      { x: 480, y: 400, w: 320, droppable: true },   // 中央（左右と100px重なる）
      { x: 520, y: 300, w: 240, droppable: true },   // 頂上
    ],
    spawns: [ {x:470,y:500}, {x:810,y:500}, {x:440,y:600}, {x:840,y:600} ],
  },
  {
    // 浮いた床が左右・上下に往復して動くステージ
    // move: {axis:'x'|'y', range:振れ幅px, speed:px/tick, dir:初速の向き}
    // ⚠️ 決定論のため床移動は毎tickの整数加算(off+=vel)＝三角波。Math.sinは使わない
    name: "うごく床",
    theme: { sky:["#241a2e","#3a2450","#5a3a7a"], mountain:"rgba(45,30,65,0.7)",
             dirt:"#3e3450", grass:"#8a6ad0", grass2:"#6a4ab0", plat:"#b088e0", platTop:"#cbb0f0" },
    platforms: [
      { x: 220, y: 585, w: 840, droppable: false, main: true },
      { x: 300, y: 470, w: 160, droppable: true, move: { axis: "x", range: 160, speed: 1.4, dir: 1 } },
      { x: 800, y: 470, w: 160, droppable: true, move: { axis: "x", range: 160, speed: 1.4, dir: -1 } },
      { x: 540, y: 400, w: 200, droppable: true, move: { axis: "y", range: 80, speed: 1.1, dir: 1 } },
    ],
    spawns: [ {x:360,y:585}, {x:920,y:585}, {x:480,y:585}, {x:800,y:585} ],
  },
  {
    // 第4の変化系: メイン地面の両隅に上下する壁。左が上がると右は下がって見えない（逆位相）
    // 壁が上がっている側は場外に飛ばされにくく、下がっている側が狙い目になる
    name: "うごく壁",
    theme: { sky:["#1c2430","#2a3646","#3a4a5e"], mountain:"rgba(25,35,50,0.7)",
             dirt:"#3a4450", grass:"#6a8098", grass2:"#54687e", plat:"#8a94a6", platTop:"#b0bccc",
             wall:"#9aa6ba", wallTop:"#cdd8e8" },
    platforms: [
      { x: 220, y: 585, w: 840, droppable: false, main: true },
      { x: 390, y: 460, w: 170, droppable: true },
      { x: 720, y: 460, w: 170, droppable: true },
    ],
    spawns: [ {x:360,y:585}, {x:920,y:585}, {x:500,y:585}, {x:780,y:585} ],
    walls: [
      { x: 236, w: 26, height: 150, side: "left" },
      { x: 1018, w: 26, height: 150, side: "right" },
    ],
    wallSpeed: 0.007,   // 位相の毎tick変化（三角波 0..1、約2.4秒で上下反転）
  },
];

const COLORS   = ["#e74c3c", "#3498db", "#f1c40f", "#2ecc71"];
const COLORS_D = ["#a93226", "#21618c", "#b7950b", "#1e8449"];
const NAMES    = ["P1", "P2", "P3", "P4"];

/* ======================= 入力レイヤー ======================= */
// 押下中キーの集合（ブラウザイベント → ここに集約）
const keys = new Set();
const USED_CODES = new Set([
  "KeyW","KeyA","KeyS","KeyD","KeyF","KeyG","KeyH","KeyO",
  "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Comma","Period",
  "Enter","Escape","Space",
]);
window.addEventListener("keydown", e => {
  if (USED_CODES.has(e.code)) e.preventDefault();
  if (!e.repeat) keys.add(e.code);
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => keys.clear());

const NEUTRAL = Object.freeze({ left:false,right:false,up:false,down:false,jump:false,attack:false,guard:false,start:false });

// キーボード2系統のマッピング
const KB_MAPS = [
  { left:"KeyA", right:"KeyD", up:"KeyW", down:"KeyS", jump:"KeyW", attack:"KeyF", guard:"KeyG" },
  { left:"ArrowLeft", right:"ArrowRight", up:"ArrowUp", down:"ArrowDown", jump:"ArrowUp", attack:"Comma", guard:"Period" },
];

// 入力ソース: sample() が InputSample を返す。将来 NetworkSource を足すだけでオンライン化できる
function makeKeyboardSource(mapIdx) {
  const m = KB_MAPS[mapIdx];
  return {
    id: "kb" + mapIdx,
    label: mapIdx === 0 ? "キーボード左 (WASD+F)" : "キーボード右 (矢印+ , )",
    sample() {
      return {
        left: keys.has(m.left), right: keys.has(m.right),
        up: keys.has(m.up), down: keys.has(m.down),
        jump: keys.has(m.jump), attack: keys.has(m.attack),
        guard: keys.has(m.guard),
        start: keys.has("Enter"),
      };
    },
  };
}

function makeGamepadSource(index) {
  return {
    id: "pad" + index,
    label: "パッド" + (index + 1),
    sample() {
      const gp = navigator.getGamepads()[index];
      if (!gp) return NEUTRAL;
      const ax = gp.axes[0] || 0;
      const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
      return {
        left:  ax < -0.4 || btn(14),
        right: ax >  0.4 || btn(15),
        up:    (gp.axes[1] || 0) < -0.5 || btn(12),
        down:  (gp.axes[1] || 0) >  0.5 || btn(13),
        jump:  btn(0) || btn(1),          // A/B (×/○)
        attack: btn(2) || btn(3),         // X/Y (□/△)
        guard: btn(4) || btn(5) || btn(6) || btn(7),  // L/R (ショルダー/トリガー)
        start: btn(9),
      };
    },
  };
}

/* ==================== シミュレーション ==================== */

function makePlayer(slotIdx, stage) {
  const sp = stage.spawns[slotIdx];
  return {
    slot: slotIdx,
    x: sp.x, y: sp.y - 40,       // y は足元
    vx: 0, vy: 0,
    facing: sp.x < W / 2 ? 1 : -1,
    onGround: false,
    airJumps: PHYS.airJumps,
    dropTimer: 0,                 // すり抜け降下中の無視時間
    damage: 0,
    stocks: STOCKS,
    alive: true,
    invuln: 90,
    hitstun: 0,
    attackTimer: 0,
    attackIsSpecial: false,       // 現在の攻撃が必殺技か
    attackVictims: [],
    chargeTimer: 0,               // 必殺技チャージ経過tick（攻撃長押し）
    guardHp: GUARD.max,           // 卵の残量（0で使い切り＝復活まで使えない）
    guarding: false,
    guardBreakFlash: 0,
    itemType: null,               // 所持中アイテム効果 "reach" | "speed" | null
    itemTimer: 0,                 // 効果の残り時間tick
    itemGetFlash: 0,
    hitFlash: 0,
    prev: NEUTRAL,                // 前フレーム入力（エッジ検出用・状態の一部として保持）
  };
}

function makeMatchState(slotIndices, stageIndex) {
  const idx = (stageIndex | 0) % STAGES.length;
  const stage = STAGES[idx];
  // 決定論PRNGの種（両クライアントで同一）。0は不可なので必ず非0に。
  let seed = ((idx + 1) * 2654435761) | 0;
  if (seed === 0) seed = 1;
  // 足場は可変（動く床）なのでライブなコピーを作る（静的STAGESは書き換えない）
  const platforms = stage.platforms.map(pl => {
    const c = { x: pl.x, y: pl.y, w: pl.w, droppable: pl.droppable, main: pl.main, dx: 0, dy: 0 };
    if (pl.move) {
      c.baseX = pl.x; c.baseY = pl.y;
      c.moveAxis = pl.move.axis; c.moveRange = pl.move.range;
      c.off = 0; c.vel = pl.move.speed * (pl.move.dir || 1);
    }
    return c;
  });
  // 地面の高さ（動く壁の基準）
  const mains = stage.platforms.filter(p => p.main);
  const groundY = mains.length ? Math.max(...mains.map(p => p.y)) : 585;
  // 動く壁のライブコピー
  const walls = (stage.walls || []).map(w => ({
    x: w.x, w: w.w, height: w.height, side: w.side,
    top: groundY + 8, bottom: groundY + 40, raise: 0,
  }));
  return {
    tick: 0,
    countdown: COUNTDOWN_TICKS,
    hitstop: 0,
    ending: false,
    endTimer: 0,
    finished: false,
    winnerSlot: null,
    stageIndex: idx,
    stage,
    platforms,                    // ライブな足場（動く床を含む）
    groundY,                      // 地面の高さ（壁の基準）
    walls,                        // 動く壁（ライブ）
    wallPhase: 0,                 // 0..1 の位相（三角波）
    wallVel: stage.wallSpeed || 0,
    rng: seed,                    // xorshift32 の状態
    items: [],                    // 落下中/設置中のアイテム
    itemTimer: ITEM.firstSpawn,   // 次の出現までのtick
    players: slotIndices.map(s => makePlayer(s, stage)),
  };
}

// 動く壁を1tick更新（決定論）。位相0..1の三角波。左右は逆位相（left=phase, right=1-phase）
function updateWalls(state) {
  if (state.walls.length === 0) return;
  state.wallPhase += state.wallVel;
  if (state.wallPhase >= 1) { state.wallPhase = 1; state.wallVel = -state.wallVel; }
  else if (state.wallPhase <= 0) { state.wallPhase = 0; state.wallVel = -state.wallVel; }
  const g = state.groundY;
  for (const w of state.walls) {
    const raise = w.side === "left" ? state.wallPhase : 1 - state.wallPhase;
    w.raise = raise;
    w.top = g + 8 - (w.height + 8) * raise;  // raise=1→g-height(上), raise=0→g+8(地面下＝隠れる)
    w.bottom = g + 40;
  }
}

// 動く床を1tick更新（決定論: off += vel の三角波）。dx/dyに今tickの移動量を記録
function updateMovingPlatforms(state) {
  for (const plat of state.platforms) {
    plat.dx = 0; plat.dy = 0;
    if (plat.moveAxis === undefined) continue;
    const old = plat.off;
    plat.off += plat.vel;
    if (plat.off > plat.moveRange) { plat.off = plat.moveRange; plat.vel = -plat.vel; }
    else if (plat.off < -plat.moveRange) { plat.off = -plat.moveRange; plat.vel = -plat.vel; }
    const delta = plat.off - old;
    if (plat.moveAxis === "x") { plat.x = plat.baseX + plat.off; plat.dx = delta; }
    else { plat.y = plat.baseY + plat.off; plat.dy = delta; }
  }
}

// 決定論的乱数（xorshift32）。ビット演算のみ＝全環境で同一結果。[0,1) を返す。
function rngNext(state) {
  let x = state.rng | 0;
  x ^= x << 13; x |= 0;
  x ^= x >>> 17;
  x ^= x << 5;  x |= 0;
  state.rng = x;
  return (x >>> 0) / 4294967296;
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// 1tick 進める。決定論的（state と samples のみに依存）
function stepMatch(state, samples) {
  const events = [];
  state.tick++;

  if (state.hitstop > 0) { state.hitstop--; return events; }

  const inCountdown = state.countdown > 0;
  if (inCountdown) {
    state.countdown--;
    if (state.countdown === 0) events.push({ type: "go" });
  }

  const ps = state.players;

  // --- 動く床: 乗っているプレイヤーを一緒に運ぶ ---
  // 1) 移動前の位置で「どの動く床に乗っているか」を判定
  const carriers = ps.map(p => {
    if (!p.alive || !p.onGround) return null;
    for (const plat of state.platforms) {
      if (plat.moveAxis === undefined) continue;
      if (p.x >= plat.x && p.x <= plat.x + plat.w && Math.abs(p.y - plat.y) < 1.5) return plat;
    }
    return null;
  });
  // 2) 床を動かす（決定論的）
  updateMovingPlatforms(state);
  updateWalls(state);
  // 3) 乗っているプレイヤーを床と一緒に運ぶ。
  //    縦方向は床top(plat.y)へスナップ＝floatズレで着地判定が外れて落ちるのを防ぐ。
  for (let i = 0; i < ps.length; i++) {
    const plat = carriers[i];
    if (plat) { ps[i].x += plat.dx; ps[i].y = plat.y; }
  }

  // --- 各プレイヤーの入力・移動 ---
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (!p.alive) continue;
    const cur = (inCountdown || state.ending) ? NEUTRAL : samples[i];
    const prev = p.prev;
    const canAct = p.hitstun === 0;

    // タイマー類
    if (p.hitstun > 0) p.hitstun--;
    if (p.attackTimer > 0) p.attackTimer--;
    if (p.invuln > 0) p.invuln--;
    if (p.dropTimer > 0) p.dropTimer--;
    if (p.hitFlash > 0) p.hitFlash--;
    if (p.guardBreakFlash > 0) p.guardBreakFlash--;
    if (p.itemGetFlash > 0) p.itemGetFlash--;
    if (p.itemTimer > 0) { p.itemTimer--; if (p.itemTimer === 0) p.itemType = null; }

    // --- ガード（卵型シールド）---
    // 地上・卵が残っている・行動可能なときだけ展開。展開中は移動不可＆時間で縮む。
    p.guarding = cur.guard && canAct && p.onGround && p.guardHp > 0 && p.attackTimer === 0;
    if (p.guarding) {
      p.guardHp -= GUARD.drain;
      p.vx = 0;
      if (p.guardHp <= 0) {           // 時間切れで割れた
        p.guardHp = 0;
        p.guarding = false;
        p.guardBreakFlash = 20;
        p.hitstun = GUARD.breakStun;
        events.push({ type: "guardbreak", x: p.x, y: p.y - PLAYER_H / 2, slot: p.slot });
      }
    }
    const locked = p.guarding;        // ガード中は左右上下・攻撃すべて不可

    const dir = (canAct && !locked) ? ((cur.right ? 1 : 0) - (cur.left ? 1 : 0)) : 0;
    if (dir !== 0) p.facing = dir;

    // 水平移動（speedアイテムで最高速・加速が1.5倍）
    const spd = p.itemType === "speed" ? ITEM.speedMult : 1;
    const maxRun = PHYS.maxRun * spd, maxAir = PHYS.maxAir * spd;
    if (p.onGround) {
      if (dir !== 0) {
        if (p.vx * dir < maxRun) {
          p.vx += PHYS.groundAccel * spd * dir;
          if (p.vx * dir > maxRun) p.vx = maxRun * dir;
        }
      } else {
        p.vx *= PHYS.friction;
        if (Math.abs(p.vx) < 0.05) p.vx = 0;
      }
    } else {
      if (dir !== 0) {
        if (p.vx * dir < maxAir) {
          p.vx += PHYS.airAccel * spd * dir;
          if (p.vx * dir > maxAir) p.vx = maxAir * dir;
        }
      } else {
        p.vx *= PHYS.airDrag;
      }
    }

    // ジャンプ（エッジ）。speedアイテムでジャンプ力も1.5倍
    const jumpEdge = cur.jump && !prev.jump;
    const jmul = p.itemType === "speed" ? ITEM.speedMult : 1;
    if (jumpEdge && canAct && !locked) {
      if (p.onGround) {
        p.vy = PHYS.jumpVel * jmul;
        p.onGround = false;
      } else if (p.airJumps > 0) {
        p.vy = PHYS.doubleJumpVel * jmul;
        p.airJumps--;
      }
    }

    // すり抜け降下（薄い足場の上で下エッジ）
    const downEdge = cur.down && !prev.down;
    if (downEdge && canAct && !locked && p.onGround) {
      const plat = platformUnder(p, state.platforms);
      if (plat && plat.droppable) {
        p.onGround = false;
        p.dropTimer = 10;
        p.y += 2;
      }
    }

    // 重力（空中で下入力＝急降下）
    if (!p.onGround) {
      const fast = cur.down && p.vy > 0;
      p.vy += fast ? PHYS.fastFallGravity : PHYS.gravity;
      const cap = fast ? PHYS.maxFastFall : PHYS.maxFall;
      if (p.vy > cap) p.vy = cap;
    }

    // --- 攻撃 / 必殺技チャージ ---
    // 攻撃ボタン押しっぱなしでチャージ。2秒(SPECIAL_CHARGE)で必殺技が自動発動。
    // 2秒未満で離すと通常攻撃。ガード中・攻撃硬直中はチャージしない。
    if (canAct && !locked && p.attackTimer === 0) {
      if (cur.attack) {
        p.chargeTimer++;
        if (p.chargeTimer >= SPECIAL_CHARGE) {
          p.attackTimer = SPECIAL.total;
          p.attackIsSpecial = true;
          p.attackVictims = [];
          p.chargeTimer = 0;
          events.push({ type: "special", x: p.x, y: p.y - PLAYER_H / 2, slot: p.slot });
        }
      } else {
        if (p.chargeTimer > 0) {       // 離した＝通常攻撃
          p.attackTimer = ATTACK.total;
          p.attackIsSpecial = false;
          p.attackVictims = [];
        }
        p.chargeTimer = 0;
      }
    } else if (!cur.attack) {
      p.chargeTimer = 0;
    }

    // 位置の積分 + 足場着地
    const prevY = p.y;
    p.x += p.vx;
    p.y += p.vy;

    if (p.vy >= 0) {
      let landed = false;
      for (const plat of state.platforms) {
        if (plat.droppable && p.dropTimer > 0) continue;
        if (p.x + PLAYER_W / 2 <= plat.x || p.x - PLAYER_W / 2 >= plat.x + plat.w) continue;
        if (prevY <= plat.y && p.y >= plat.y) {
          p.y = plat.y;
          p.vy = 0;
          landed = true;
          break;
        }
      }
      if (landed) {
        if (!p.onGround) events.push({ type: "land", x: p.x, y: p.y });
        p.onGround = true;
        p.airJumps = PHYS.airJumps;
      } else {
        p.onGround = false;
      }
    } else {
      p.onGround = false;
    }

    p.prev = cur;
  }

  // --- 動く壁との当たり判定（横方向に押し出す）---
  if (state.walls.length) {
    for (const p of ps) {
      if (!p.alive) continue;
      for (const w of state.walls) {
        if (w.raise <= 0.02) continue;  // 下がって隠れている壁は素通り
        const pl = p.x - PLAYER_W / 2, pr = p.x + PLAYER_W / 2, pt = p.y - PLAYER_H, pb = p.y;
        if (pr > w.x && pl < w.x + w.w && pb > w.top && pt < w.bottom) {
          const pushL = pr - w.x;                  // 左へ出る量
          const pushR = (w.x + w.w) - pl;          // 右へ出る量
          if (pushL < pushR) { p.x -= pushL; if (p.vx > 0) p.vx = 0; }
          else { p.x += pushR; if (p.vx < 0) p.vx = 0; }
        }
      }
    }
  }

  // --- 攻撃判定 ---
  for (let i = 0; i < ps.length; i++) {
    const a = ps[i];
    if (!a.alive) continue;
    const atk = a.attackIsSpecial ? SPECIAL : ATTACK;
    if (a.attackTimer > atk.activeFrom || a.attackTimer < atk.activeTo || a.attackTimer === 0) continue;
    const range = atk.range * (a.itemType === "reach" ? ITEM.reachMult : 1);  // reachアイテムでリーチ延長
    const hx = a.facing === 1 ? a.x + PLAYER_W / 2 - 6 : a.x - PLAYER_W / 2 - range + 6;
    const hy = a.y - PLAYER_H / 2 - atk.height / 2 - 4;
    for (let j = 0; j < ps.length; j++) {
      if (i === j) continue;
      const v = ps[j];
      if (!v.alive || v.invuln > 0 || a.attackVictims.includes(j)) continue;
      if (!rectsOverlap(hx, hy, range, atk.height,
                        v.x - PLAYER_W / 2, v.y - PLAYER_H, PLAYER_W, PLAYER_H)) continue;
      a.attackVictims.push(j);

      // ガードで防御中
      if (v.guarding && !atk.special) {
        // 通常攻撃は防げる：卵が減るだけ（ダメージ・ふっとばし無し）。小さく押される。
        v.guardHp -= GUARD.hitCost;
        v.vx = 1.5 * a.facing;
        state.hitstop = 4;
        if (v.guardHp <= 0) {
          v.guardHp = 0; v.guarding = false;
          v.guardBreakFlash = 20; v.hitstun = GUARD.breakStun;
          events.push({ type: "guardbreak", x: v.x, y: v.y - PLAYER_H / 2, slot: v.slot });
        } else {
          events.push({ type: "block", x: v.x + a.facing * 16, y: v.y - PLAYER_H / 2 });
        }
        continue;
      }
      // 必殺技はガードを一撃で粉砕して当たる
      if (v.guarding && atk.special) {
        v.guardHp = 0; v.guarding = false; v.guardBreakFlash = 24;
        events.push({ type: "guardbreak", x: v.x, y: v.y - PLAYER_H / 2, slot: v.slot });
      }

      // ヒット（通常/必殺共通、角度45度上方向）
      v.damage += atk.damage;
      const kb = atk.kbBase + v.damage * atk.kbScale;
      const rad = atk.angleDeg * Math.PI / 180;
      v.vx = Math.cos(rad) * kb * a.facing;
      v.vy = -Math.sin(rad) * kb;
      v.hitstun = Math.floor(4 + kb * 2.0);
      v.onGround = false;
      v.hitFlash = 8;
      v.chargeTimer = 0;             // 被弾でチャージ中断
      v.attackTimer = 0;
      v.attackIsSpecial = false;
      state.hitstop = atk.hitstopFrames;
      events.push({ type: atk.special ? "special-hit" : "hit", x: (a.x + v.x) / 2, y: v.y - PLAYER_H / 2, dir: a.facing, dmg: v.damage });
    }
  }

  // --- アイテム（出現・落下・取得）---
  if (!inCountdown && !state.ending) {
    // 出現
    if (state.itemTimer > 0) state.itemTimer--;
    if (state.itemTimer === 0) {
      state.itemTimer = ITEM.spawnInterval;
      if (state.items.length < ITEM.maxOnField) {
        const type = ITEM_TYPES[rngNext(state) < 0.5 ? 0 : 1];
        const margin = 160;
        const x = margin + rngNext(state) * (W - margin * 2);
        state.items.push({ type, x, y: -30, vy: 0, landed: false });
        events.push({ type: "item-spawn", x, itemType: type });
      }
    }
    // 落下＋設置
    for (const it of state.items) {
      if (!it.landed) {
        it.vy += ITEM.gravity;
        if (it.vy > ITEM.maxFall) it.vy = ITEM.maxFall;
        const prevY = it.y;
        it.y += it.vy;
        for (const plat of state.platforms) {
          if (it.x <= plat.x || it.x >= plat.x + plat.w) continue;
          if (prevY <= plat.y && it.y >= plat.y) {
            it.y = plat.y - ITEM.radius; it.vy = 0; it.landed = true;
            events.push({ type: "item-land", x: it.x, y: it.y });
            break;
          }
        }
      }
    }
    // 取得（落下中でも先に触れた方が取る）＋ ギャップ落下で消滅
    for (let k = state.items.length - 1; k >= 0; k--) {
      const it = state.items[k];
      if (it.y > BLAST.bottom) { state.items.splice(k, 1); continue; }
      let taken = -1;
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        if (!p.alive) continue;
        if (rectsOverlap(it.x - ITEM.radius, it.y - ITEM.radius, ITEM.radius * 2, ITEM.radius * 2,
                         p.x - PLAYER_W / 2, p.y - PLAYER_H, PLAYER_W, PLAYER_H)) {
          taken = i; break;
        }
      }
      if (taken >= 0) {
        const p = ps[taken];
        p.itemType = it.type;
        p.itemTimer = ITEM.duration[it.type];
        p.itemGetFlash = 24;
        state.items.splice(k, 1);
        events.push({ type: "item-get", x: p.x, y: p.y - PLAYER_H, slot: p.slot, itemType: it.type });
      }
    }
  }

  // --- 場外KO ---
  for (const p of ps) {
    if (!p.alive) continue;
    if (p.x < BLAST.left || p.x > BLAST.right || p.y < BLAST.top || p.y > BLAST.bottom) {
      p.stocks--;
      events.push({ type: "ko", slot: p.slot, x: Math.max(40, Math.min(W - 40, p.x)), y: Math.max(40, Math.min(H - 40, p.y)) });
      if (p.stocks > 0) {
        const sp = state.stage.spawns[p.slot];
        p.x = sp.x; p.y = sp.y - 120;
        p.vx = 0; p.vy = 0;
        p.damage = 0;
        p.hitstun = 0; p.attackTimer = 0; p.attackIsSpecial = false;
        p.chargeTimer = 0;
        p.guardHp = GUARD.max; p.guarding = false; p.guardBreakFlash = 0;  // 卵は復活で全回復
        p.itemType = null; p.itemTimer = 0;                                // アイテム効果もリセット
        p.airJumps = PHYS.airJumps;
        p.invuln = RESPAWN_INVULN;
      } else {
        p.alive = false;
      }
    }
  }

  // --- 決着判定 ---
  if (!state.ending) {
    const alive = ps.filter(p => p.alive);
    if (alive.length <= 1) {
      state.ending = true;
      state.endTimer = 70;
      state.winnerSlot = alive.length === 1 ? alive[0].slot : null;
      events.push({ type: "finish" });
    }
  } else if (state.endTimer > 0) {
    state.endTimer--;
    if (state.endTimer === 0) state.finished = true;
  }

  return events;
}

function platformUnder(p, platforms) {
  for (const plat of platforms) {
    if (p.y === plat.y &&
        p.x + PLAYER_W / 2 > plat.x && p.x - PLAYER_W / 2 < plat.x + plat.w) {
      return plat;
    }
  }
  return null;
}

/* ==================== アプリ状態（ロビー等） ==================== */

const APP = {
  phase: "lobby",           // lobby | match | result
  mode: "local",            // local | online
  slots: [null, null, null, null],   // {source} を格納
  match: null,
  stageIndex: 0,            // ロビーで選択中のステージ
  lobbyPrev: new Map(),     // sourceId -> 前フレームsample（参加検出用）
  resultInfo: null,
};
window.APP = APP;  // デバッグ用に公開

/* ==================== オンライン対戦（2人・入力同期lockstep） ====================
 * 方式: delay-based lockstep
 *  - 両クライアントが同一の決定論的sim(stepMatch)を実行する
 *  - 送るのは毎tickの入力(1バイト)だけ。tick Tの実行には両者の入力[T]が必須
 *  - 自分の入力は「tick T実行時に T+DELAY 分を生成して送信」→ DELAY tick先で反映
 *  - 相手の入力が未着ならそのtickは待つ(stall)。届き次第追いつく
 * 接続: PeerJS(P2P)。ホストが部屋コードを発行、参加側がコードで接続 */
const NET = {
  peer: null, conn: null, isHost: false, code: null,
  status: "idle",   // idle | starting | hosting | joining | connected
  msg: "",
  gen: 0,           // 試合世代（前試合の残留inputを弾く）
  DELAY: 4,         // 入力遅延tick（60fpsで約67ms）
  buffers: [[], []],
  stall: 0,
  resultPrev: false,
};

function encodeSample(s) {
  return (s.left?1:0)|(s.right?2:0)|(s.up?4:0)|(s.down?8:0)|(s.jump?16:0)|(s.attack?32:0)|(s.guard?64:0);
}
function decodeSample(b) {
  return { left:!!(b&1), right:!!(b&2), up:!!(b&4), down:!!(b&8), jump:!!(b&16), attack:!!(b&32), guard:!!(b&64), start:false };
}

// オンライン時は手元の全デバイス（キーボード両系統+パッド）をOR合成して使う
const KB_SRC = [makeKeyboardSource(0), makeKeyboardSource(1)];
function sampleLocalMerged() {
  const out = { left:false, right:false, up:false, down:false, jump:false, attack:false, guard:false, start:false };
  const srcs = [KB_SRC[0].sample(), KB_SRC[1].sample()];
  const pads = navigator.getGamepads();
  for (let i = 0; i < pads.length; i++) if (pads[i]) srcs.push(makeGamepadSource(i).sample());
  for (const s of srcs) for (const k in out) out[k] = out[k] || s[k];
  return out;
}

function netResetBuffers() {
  NET.buffers = [[], []];
  for (let t = 0; t < NET.DELAY; t++) { NET.buffers[0][t] = NEUTRAL; NET.buffers[1][t] = NEUTRAL; }
}

const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function makeCode() {
  let s = "";
  for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
  return s;
}
const peerIdFor = code => "uchisuma-" + code;

function netHost() {
  netCleanup();
  NET.isHost = true; NET.code = makeCode();
  NET.status = "starting"; NET.msg = "サーバー接続中…";
  refreshOnlineUI();
  const peer = new Peer(peerIdFor(NET.code));
  NET.peer = peer;
  peer.on("open", () => { NET.status = "hosting"; NET.msg = ""; refreshOnlineUI(); });
  peer.on("connection", conn => {
    if (NET.conn) { conn.close(); return; }  // 2人まで
    netBindConn(conn);
  });
  peer.on("error", e => { NET.status = "idle"; NET.msg = "エラー: " + e.type; refreshOnlineUI(); });
}

function netJoin(code) {
  if (!code || code.length !== 4) { NET.msg = "4文字のコードを入れてください"; refreshOnlineUI(); return; }
  netCleanup();
  NET.isHost = false; NET.code = code;
  NET.status = "joining"; NET.msg = "接続中…";
  refreshOnlineUI();
  const peer = new Peer();
  NET.peer = peer;
  peer.on("open", () => {
    netBindConn(peer.connect(peerIdFor(code), { reliable: true, serialization: "json" }));
  });
  peer.on("error", e => { NET.status = "idle"; NET.msg = "エラー: " + e.type + "（コード間違い？）"; refreshOnlineUI(); });
}

function netBindConn(conn) {
  NET.conn = conn;
  conn.on("open", () => { NET.status = "connected"; NET.msg = ""; refreshOnlineUI(); });
  conn.on("data", netOnData);
  conn.on("close", () => {
    NET.conn = null;
    const wasPlaying = APP.mode === "online" && (APP.phase === "match" || APP.phase === "result");
    NET.status = (NET.isHost && NET.peer) ? "hosting" : "idle";
    NET.msg = "相手との接続が切れました";
    if (wasPlaying) {
      APP.match = null; APP.mode = "local"; APP.phase = "lobby";
      openOnlineMenu();
    }
    refreshOnlineUI();
  });
}

function netOnData(d) {
  if (!d || !d.y) return;
  if (d.y === "i") {
    if (d.g === NET.gen) NET.buffers[NET.isHost ? 1 : 0][d.t] = decodeSample(d.b);
  } else if (d.y === "start") {
    NET.gen = d.g;
    startOnlineMatch(d.st | 0);   // ホストが選んだステージで開始
  } else if (d.y === "leave") {
    APP.match = null; APP.mode = "local"; APP.phase = "lobby";
    NET.msg = "相手が退出しました";
    openOnlineMenu();
  }
}

function netHostStart() {
  if (!(NET.status === "connected" && NET.isHost && NET.conn && NET.conn.open)) return;
  NET.gen++;
  NET.conn.send({ y: "start", g: NET.gen, st: APP.stageIndex });
  startOnlineMatch(APP.stageIndex);
}

function startOnlineMatch(stageIndex) {
  netResetBuffers();
  NET.stall = 0; NET.resultPrev = true;
  APP.match = makeMatchState([0, 1], stageIndex);   // ホスト=P1(赤), 参加側=P2(青)
  APP.mode = "online"; APP.phase = "match";
  document.getElementById("online").hidden = true;
}

function netLeaveToMenu() {
  if (NET.conn && NET.conn.open) NET.conn.send({ y: "leave" });
  APP.match = null; APP.mode = "local"; APP.phase = "lobby";
  openOnlineMenu();
}

function netCleanup() {
  if (NET.conn) { try { NET.conn.close(); } catch (e) {} NET.conn = null; }
  if (NET.peer) { try { NET.peer.destroy(); } catch (e) {} NET.peer = null; }
  NET.status = "idle"; NET.msg = "";
}

// 1tick分のオンライン処理: 入力生成→送信→両者の入力が揃っていればsimを1歩進める
function updateOnlineMatch() {
  const m = APP.match;
  if (!m) return;
  const my = NET.isHost ? 0 : 1;

  const genTick = m.tick + NET.DELAY;
  if (!NET.buffers[my][genTick]) {
    const s = sampleLocalMerged();
    NET.buffers[my][genTick] = s;
    if (NET.conn && NET.conn.open) NET.conn.send({ y: "i", g: NET.gen, t: genTick, b: encodeSample(s) });
  }

  const ia = NET.buffers[0][m.tick], ib = NET.buffers[1][m.tick];
  if (ia && ib) {
    NET.stall = 0;
    handleEvents(stepMatch(m, [ia, ib]));
  } else {
    NET.stall++;
  }

  if (m.finished) {
    APP.resultInfo = { winnerSlot: m.winnerSlot };
    APP.phase = "result";
    NET.resultPrev = true;
  }
  if (keys.has("Escape")) {
    keys.delete("Escape");
    netLeaveToMenu();
  }
}

/* --- オンラインメニューUI（DOMオーバーレイ） --- */
const $ol = id => document.getElementById(id);

function openOnlineMenu() {
  $ol("online").hidden = false;
  refreshOnlineUI();
}

function refreshOnlineUI() {
  const idle = $ol("ol-idle"), room = $ol("ol-room");
  const codeView = $ol("ol-code-view"), share = $ol("ol-share");
  const roomMsg = $ol("ol-room-msg"), btnStart = $ol("btn-start");
  idle.hidden = !(NET.status === "idle" || NET.status === "starting" || NET.status === "joining");
  room.hidden = !(NET.status === "hosting" || NET.status === "connected");
  $ol("btn-host").disabled = $ol("btn-join").disabled = (NET.status === "starting" || NET.status === "joining");
  if (!room.hidden) {
    codeView.textContent = NET.code || "";
    share.textContent = NET.isHost ? (location.origin + location.pathname + "?room=" + NET.code) : "";
    if (NET.status === "hosting") {
      roomMsg.textContent = "友だちの参加を待っています… 上のコードかURLを伝えてください";
      btnStart.hidden = true;
    } else if (NET.status === "connected") {
      roomMsg.textContent = NET.isHost ? "接続完了！ステージを選んで開始！" : "接続完了！ホストの開始を待っています…";
      btnStart.hidden = !NET.isHost;
    }
    // ステージ選択はホストのみ（接続後）
    const stageBox = $ol("ol-stage");
    stageBox.hidden = !(NET.isHost && NET.status === "connected");
    $ol("ol-stage-name").textContent = STAGES[APP.stageIndex].name;
  }
  $ol("ol-status").textContent = NET.msg || "";
}

function olChangeStage(delta) {
  APP.stageIndex = ((APP.stageIndex + delta) % STAGES.length + STAGES.length) % STAGES.length;
  refreshOnlineUI();
}
$ol("ol-stage-prev").addEventListener("click", () => olChangeStage(-1));
$ol("ol-stage-next").addEventListener("click", () => olChangeStage(1));

$ol("btn-host").addEventListener("click", () => {
  if (typeof Peer === "undefined") { NET.msg = "通信ライブラリを読み込めませんでした（要インターネット接続）"; refreshOnlineUI(); return; }
  netHost();
});
$ol("btn-join").addEventListener("click", () => {
  if (typeof Peer === "undefined") { NET.msg = "通信ライブラリを読み込めませんでした（要インターネット接続）"; refreshOnlineUI(); return; }
  netJoin($ol("join-code").value.trim().toUpperCase());
});
$ol("btn-start").addEventListener("click", netHostStart);
$ol("btn-close").addEventListener("click", () => {
  netCleanup();
  $ol("online").hidden = true;
  if (APP.mode === "online") { APP.match = null; APP.mode = "local"; APP.phase = "lobby"; }
});

// ロビーで O キー → オンラインメニュー
window.addEventListener("keydown", e => {
  if (e.code === "KeyO" && APP.phase === "lobby" && $ol("online").hidden) openOnlineMenu();
});

// ?room=XXXX 付きURLで開いたら自動で参加を試みる
(function () {
  const room = new URLSearchParams(location.search).get("room");
  if (room && typeof Peer !== "undefined") {
    openOnlineMenu();
    $ol("join-code").value = room.toUpperCase();

function allCandidateSources() {
  const list = [makeKeyboardSource(0), makeKeyboardSource(1)];
  const pads = navigator.getGamepads();
  for (let i = 0; i < pads.length; i++) {
    if (pads[i]) list.push(makeGamepadSource(i));
  }
  return list;
}

function claimedIds() {
  return APP.slots.filter(Boolean).map(s => s.source.id);
}

function updateLobby() {
  // 注意: 全ソースの prev を先に更新しきってから遷移する
  // （ループ途中で抜けると未更新の prev が偽エッジを生む）
  const claimed = claimedIds();
  let wantStart = false, stageDelta = 0;
  for (const src of allCandidateSources()) {
    const cur = src.sample();
    const prev = APP.lobbyPrev.get(src.id) || NEUTRAL;
    APP.lobbyPrev.set(src.id, cur);
    const attackEdge = cur.attack && !prev.attack;
    if (attackEdge && !claimed.includes(src.id)) {
      const free = APP.slots.findIndex(s => s === null);
      if (free !== -1) {
        APP.slots[free] = { source: src };
        claimed.push(src.id);
      }
    }
    // 左右入力でステージ選択（誰の入力でもOK）
    if (cur.left && !prev.left) stageDelta--;
    if (cur.right && !prev.right) stageDelta++;
    if (cur.start && !prev.start) wantStart = true;  // Enter or パッドStart
  }
  if (stageDelta !== 0) {
    APP.stageIndex = ((APP.stageIndex + stageDelta) % STAGES.length + STAGES.length) % STAGES.length;
  }
  if (wantStart && APP.slots.filter(Boolean).length >= 2) startMatch();
}

function startMatch() {
  const slotIndices = [];
  APP.slots.forEach((s, i) => { if (s) slotIndices.push(i); });
  APP.match = makeMatchState(slotIndices, APP.stageIndex);
  APP.phase = "match";
}

function updateMatch() {
  if (APP.mode === "online") { updateOnlineMatch(); return; }
  const m = APP.match;
  const samples = m.players.map(p => APP.slots[p.slot].source.sample());
  const events = stepMatch(m, samples);
  handleEvents(events);

  if (m.finished) {
    APP.resultInfo = { winnerSlot: m.winnerSlot };
    APP.phase = "result";
    APP.lobbyPrev.clear();
  }
  if (keys.has("Escape")) {
    APP.phase = "lobby";
    APP.match = null;
    APP.lobbyPrev.clear();
    keys.delete("Escape");
  }
}

function updateResult() {
  if (APP.mode === "online") {
    // ホスト: Enterで再戦（startを送信）。参加側: startメッセージ待ち。Esc: 退出
    const enter = keys.has("Enter");
    if (enter && !NET.resultPrev && NET.isHost) netHostStart();
    NET.resultPrev = enter;
    if (keys.has("Escape")) {
      keys.delete("Escape");
      netLeaveToMenu();
    }
    return;
  }
  let back = false;
  for (const src of allCandidateSources()) {
    const cur = src.sample();
    const prev = APP.lobbyPrev.get(src.id) || NEUTRAL;
    APP.lobbyPrev.set(src.id, cur);
    if (cur.start && !prev.start) back = true;
  }
  if (back) {
    APP.phase = "lobby";
    APP.match = null;
  }
}

/* ==================== 演出（非決定でOKな層） ==================== */

const fx = { particles: [], shake: 0, koFlash: 0 };

function handleEvents(events) {
  for (const ev of events) {
    if (ev.type === "hit") {
      fx.shake = Math.min(10, 4 + ev.dmg * 0.03);
      for (let k = 0; k < 10; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() * 6 + 2) * ev.dir + (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.7) * 8,
          life: 18 + Math.random() * 10,
          size: 3 + Math.random() * 3,
          color: "#fff",
        });
      }
    } else if (ev.type === "ko") {
      fx.shake = 16;
      fx.koFlash = 12;
      for (let k = 0; k < 28; k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 3 + Math.random() * 9;
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          life: 24 + Math.random() * 16,
          size: 4 + Math.random() * 4,
          color: COLORS[ev.slot],
        });
      }
    } else if (ev.type === "land") {
      for (let k = 0; k < 4; k++) {
        fx.particles.push({
          x: ev.x + (Math.random() - 0.5) * 24, y: ev.y,
          vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 1.5,
          life: 10 + Math.random() * 6,
          size: 2 + Math.random() * 2,
          color: "#8a8aa0",
        });
      }
    } else if (ev.type === "special-hit") {
      fx.shake = 16;
      fx.koFlash = 8;
      for (let k = 0; k < 22; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() * 9 + 3) * ev.dir + (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.7) * 12,
          life: 22 + Math.random() * 14,
          size: 3 + Math.random() * 5,
          color: Math.random() < 0.5 ? "#fff" : "#ffd34d",
        });
      }
    } else if (ev.type === "special") {
      fx.shake = 6;   // チャージ完了フラッシュ
    } else if (ev.type === "block") {
      for (let k = 0; k < 6; k++) {
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.7) * 5,
          life: 10 + Math.random() * 6, size: 2 + Math.random() * 2,
          color: "#bfe8ff",
        });
      }
    } else if (ev.type === "guardbreak") {
      fx.shake = 10;
      for (let k = 0; k < 20; k++) {   // 卵の殻が割れて飛び散る
        const ang = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 7;
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2,
          life: 18 + Math.random() * 14, size: 3 + Math.random() * 4,
          color: Math.random() < 0.5 ? "#fff8e7" : "#ffe08a",
        });
      }
    } else if (ev.type === "item-land") {
      for (let k = 0; k < 6; k++) {
        fx.particles.push({
          x: ev.x + (Math.random() - 0.5) * 20, y: ev.y + ITEM.radius,
          vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 2,
          life: 10 + Math.random() * 6, size: 2 + Math.random() * 2, color: "#ffe08a",
        });
      }
    } else if (ev.type === "item-get") {
      fx.shake = 4;
      const col = ev.itemType === "reach" ? "#ff8c42" : "#42d9ff";
      for (let k = 0; k < 16; k++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 5;
        fx.particles.push({
          x: ev.x, y: ev.y,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          life: 16 + Math.random() * 10, size: 3 + Math.random() * 3, color: col,
        });
      }
    }
  }
}

function updateFx() {
  fx.shake *= 0.85;
  if (fx.koFlash > 0) fx.koFlash--;
  for (let i = fx.particles.length - 1; i >= 0; i--) {
    const pt = fx.particles[i];
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += 0.3;
    pt.life--;
    if (pt.life <= 0) fx.particles.splice(i, 1);
  }
}

/* ==================== 描画 ==================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function drawBackground(stage) {
  const th = (stage || STAGES[0]).theme;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(0.7, th.sky[1]);
  g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 遠景の山
  ctx.fillStyle = th.mountain;
  ctx.beginPath();
  ctx.moveTo(0, 620); ctx.lineTo(250, 380); ctx.lineTo(520, 600);
  ctx.lineTo(760, 340); ctx.lineTo(1060, 610); ctx.lineTo(1280, 460);
  ctx.lineTo(1280, 720); ctx.lineTo(0, 720);
  ctx.fill();
}

function drawStage(platforms, theme) {
  const th = theme;
  for (const plat of platforms) {
    if (plat.main) {
      ctx.fillStyle = th.dirt;
      ctx.fillRect(plat.x, plat.y, plat.w, H - plat.y);
      ctx.fillStyle = th.grass;
      ctx.fillRect(plat.x, plat.y, plat.w, 14);
      ctx.fillStyle = th.grass2;
      ctx.fillRect(plat.x, plat.y + 14, plat.w, 5);
    } else {
      // 動く床は少し目立たせる（縁取り＋矢印なし・厚め）
      const moving = plat.moveAxis !== undefined;
      ctx.fillStyle = th.plat;
      ctx.fillRect(plat.x, plat.y, plat.w, moving ? 14 : 12);
      ctx.fillStyle = th.platTop;
      ctx.fillRect(plat.x, plat.y, plat.w, 4);
      if (moving) {
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 2;
        ctx.strokeRect(plat.x, plat.y, plat.w, 14);
      }
    }
  }
}

// 動く壁を描画（地面から上に出ている部分だけ。下がりきると見えない）
function drawWalls(walls, groundY, theme) {
  for (const w of walls) {
    if (w.top >= groundY) continue;   // 地面下＝隠れている
    const h = groundY - w.top;
    ctx.fillStyle = theme.wall || "#8a94a6";
    ctx.fillRect(w.x, w.top, w.w, h);
    ctx.fillStyle = theme.wallTop || "#c0ccdc";
    ctx.fillRect(w.x, w.top, w.w, 7);
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.top, w.w, h);
    // 上下の矢印ヒント
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("↕", w.x + w.w / 2, w.top - 6);
  }
}

// 静的ステージから壁のプレビュー用スナップショットを作る（ロビー用）
function wallSnapshot(stage, phase) {
  if (!stage.walls) return { walls: [], groundY: 585 };
  const mains = stage.platforms.filter(p => p.main);
  const g = mains.length ? Math.max(...mains.map(p => p.y)) : 585;
  const walls = stage.walls.map(w => {
    const raise = w.side === "left" ? phase : 1 - phase;
    return { x: w.x, w: w.w, top: g + 8 - (w.height + 8) * raise };
  });
  return { walls, groundY: g };
}

const ITEM_STYLE = {
  reach: { color: "#ff8c42", dark: "#c85a1a", label: "リーチ" },
  speed: { color: "#42d9ff", dark: "#1a8fc8", label: "スピード" },
};

// アイテム本体を描画（落下中はふわっと揺れる）
function drawItem(it) {
  const st = ITEM_STYLE[it.type];
  const r = ITEM.radius;
  const bob = it.landed ? Math.sin(performance.now() / 300 + it.x) * 3 : 0;
  const cx = it.x, cy = it.y + bob;
  // 光るカプセル
  ctx.save();
  ctx.shadowColor = st.color;
  ctx.shadowBlur = 14;
  ctx.fillStyle = st.color;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  // アイコン
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  if (it.type === "reach") {
    // 双方向矢印（リーチ）
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy);
    ctx.moveTo(cx - 9, cy); ctx.lineTo(cx - 4, cy - 5);
    ctx.moveTo(cx - 9, cy); ctx.lineTo(cx - 4, cy + 5);
    ctx.moveTo(cx + 9, cy); ctx.lineTo(cx + 4, cy - 5);
    ctx.moveTo(cx + 9, cy); ctx.lineTo(cx + 4, cy + 5);
    ctx.stroke();
  } else {
    // 稲妻（スピード）
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.moveTo(cx + 2, cy - 9); ctx.lineTo(cx - 6, cy + 1);
    ctx.lineTo(cx - 1, cy + 1); ctx.lineTo(cx - 3, cy + 9);
    ctx.lineTo(cx + 6, cy - 2); ctx.lineTo(cx + 1, cy - 2);
    ctx.closePath();
    ctx.fill();
  }
}

function drawPlayer(p) {
  if (!p.alive) return;
  const bx = p.x - PLAYER_W / 2;
  const by = p.y - PLAYER_H;

  // リスポーン無敵は点滅
  if (p.invuln > 0 && Math.floor(p.invuln / 4) % 2 === 0 && p.invuln > 30) {
    ctx.globalAlpha = 0.35;
  }

  // 体
  ctx.fillStyle = p.hitFlash > 0 ? "#ffffff" : COLORS[p.slot];
  ctx.strokeStyle = COLORS_D[p.slot];
  ctx.lineWidth = 3;
  roundRect(bx, by, PLAYER_W, PLAYER_H, 8);
  ctx.fill();
  ctx.stroke();

  // 目（向いてる方向）
  ctx.fillStyle = "#fff";
  const eyeX = p.x + p.facing * 6;
  ctx.beginPath();
  ctx.arc(eyeX - 4, by + 14, 4.5, 0, Math.PI * 2);
  ctx.arc(eyeX + 6, by + 14, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(eyeX - 4 + p.facing * 1.5, by + 14, 2, 0, Math.PI * 2);
  ctx.arc(eyeX + 6 + p.facing * 1.5, by + 14, 2, 0, Math.PI * 2);
  ctx.fill();

  // 攻撃スイング（通常/必殺で色・大きさが変わる、reachアイテムでリーチ延長）
  const atk = p.attackIsSpecial ? SPECIAL : ATTACK;
  if (p.attackTimer <= atk.activeFrom && p.attackTimer >= atk.activeTo && p.attackTimer > 0) {
    const cx = p.facing === 1 ? p.x + PLAYER_W / 2 : p.x - PLAYER_W / 2;
    const cy = p.y - PLAYER_H / 2 - 4;
    const prog = (atk.activeFrom - p.attackTimer) / (atk.activeFrom - atk.activeTo);
    const hasReach = p.itemType === "reach";
    const drawRange = atk.range * (hasReach ? ITEM.reachMult : 1);
    if (hasReach) {
      ctx.strokeStyle = "rgba(255,150,60," + (0.95 - prog * 0.4) + ")";
      ctx.lineWidth = p.attackIsSpecial ? 15 : 10;
    } else if (p.attackIsSpecial) {
      ctx.strokeStyle = "rgba(255,180,60," + (0.95 - prog * 0.4) + ")";
      ctx.lineWidth = 13;
    } else {
      ctx.strokeStyle = "rgba(255,255,255," + (0.9 - prog * 0.5) + ")";
      ctx.lineWidth = 7;
    }
    ctx.beginPath();
    const a0 = p.facing === 1 ? -1.3 : Math.PI + 1.3;
    const a1 = p.facing === 1 ? 1.1 : Math.PI - 1.1;
    ctx.arc(cx, cy, drawRange - 4, a0, a1, p.facing !== 1);
    ctx.stroke();
  }

  // 必殺技チャージ中のオーラ
  if (p.chargeTimer > 0) {
    const t = Math.min(1, p.chargeTimer / SPECIAL_CHARGE);
    const r = PLAYER_W * 0.9 + t * 26;
    ctx.globalAlpha = 0.35 + 0.4 * t;
    ctx.strokeStyle = t >= 1 ? "#ff5030" : "#ffb43c";
    ctx.lineWidth = 2 + 4 * t;
    ctx.beginPath();
    ctx.arc(p.x, p.y - PLAYER_H / 2, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // チャージゲージ（頭上）
    const gw = 44, gx = p.x - gw / 2, gy = by - 26;
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(gx, gy, gw, 6);
    ctx.fillStyle = t >= 1 ? "#ff5030" : "#ffd34d";
    ctx.fillRect(gx, gy, gw * t, 6);
  }

  // アイテム所持中: 足元の光るリング（残り時間で細くなる）＋取得フラッシュ
  if (p.itemType && p.itemTimer > 0) {
    const st = ITEM_STYLE[p.itemType];
    const frac = p.itemTimer / ITEM.duration[p.itemType];
    ctx.save();
    ctx.strokeStyle = st.color;
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    // 足元の弧（残り時間ぶん）
    ctx.arc(p.x, p.y - 4, PLAYER_W * 0.75, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
    ctx.stroke();
    if (p.itemGetFlash > 0) {
      ctx.globalAlpha = p.itemGetFlash / 24;
      ctx.fillStyle = st.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y - PLAYER_H / 2, PLAYER_W, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // 頭上の名前
  ctx.globalAlpha = Math.min(ctx.globalAlpha, 0.9);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(NAMES[p.slot], p.x, by - 8);
  ctx.globalAlpha = 1;
  // アイテムアイコン（名前の上）
  if (p.itemType && p.itemTimer > 0) {
    const st = ITEM_STYLE[p.itemType];
    ctx.fillStyle = st.color;
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(st.label, p.x, by - 24);
  }

  // ガードの卵（残量ぶんだけ大きさが変わる。半透明の殻）
  if (p.guarding && p.guardHp > 0) {
    const frac = p.guardHp / GUARD.max;
    const cx = p.x, cy = p.y - PLAYER_H / 2;
    const rx = (PLAYER_W * 0.62 + 12) * (0.45 + 0.55 * frac);
    const ry = (PLAYER_H * 0.62 + 12) * (0.45 + 0.55 * frac);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    // 卵型（上が細く下が丸い）
    ctx.moveTo(0, -ry);
    ctx.bezierCurveTo(rx, -ry, rx, ry * 0.55, 0, ry);
    ctx.bezierCurveTo(-rx, ry * 0.55, -rx, -ry, 0, -ry);
    ctx.closePath();
    ctx.fillStyle = "rgba(180,230,255," + (0.18 + 0.22 * frac) + ")";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(210,245,255," + (0.5 + 0.4 * frac) + ")";
    ctx.stroke();
    ctx.restore();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function damageColor(d) {
  if (d < 40) return "#ffffff";
  if (d < 80) return "#ffd34d";
  if (d < 120) return "#ff8c42";
  return "#ff4040";
}

function drawHUD(m) {
  const n = m.players.length;
  const panelW = 190, gap = 26;
  const totalW = n * panelW + (n - 1) * gap;
  let x = (W - totalW) / 2;
  for (const p of m.players) {
    ctx.fillStyle = "rgba(10,10,20,0.65)";
    roundRect(x, 632, panelW, 74, 10);
    ctx.fill();
    ctx.strokeStyle = COLORS[p.slot];
    ctx.lineWidth = 3;
    roundRect(x, 632, panelW, 74, 10);
    ctx.stroke();

    ctx.fillStyle = COLORS[p.slot];
    ctx.font = "bold 18px sans-serif";
    ctx.textAlign = "left";
    let nameLabel = NAMES[p.slot];
    if (APP.mode === "online") nameLabel += (p.slot === (NET.isHost ? 0 : 1)) ? " あなた" : " 相手";
    ctx.fillText(nameLabel, x + 14, 658);

    // ダメージ%
    ctx.textAlign = "right";
    if (p.alive) {
      ctx.fillStyle = damageColor(p.damage);
      ctx.font = "bold 30px sans-serif";
      ctx.fillText(Math.floor(p.damage) + "%", x + panelW - 14, 665);
    } else {
      ctx.fillStyle = "#888";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText("KO", x + panelW - 14, 662);
    }

    // ストック
    for (let s = 0; s < STOCKS; s++) {
      ctx.beginPath();
      ctx.arc(x + 20 + s * 20, 686, 7, 0, Math.PI * 2);
      ctx.fillStyle = s < p.stocks ? COLORS[p.slot] : "rgba(255,255,255,0.15)";
      ctx.fill();
    }

    // ガードの卵（残量ゲージ）
    const gframe = p.guardHp / GUARD.max;
    const egx = x + panelW - 60, egy = 686, egw = 44, egh = 9;
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRect(egx, egy - egh / 2, egw, egh, 4); ctx.fill();
    if (p.guardHp > 0) {
      ctx.fillStyle = gframe > 0.35 ? "#bfe8ff" : "#ff8c6b";
      roundRect(egx, egy - egh / 2, egw * gframe, egh, 4); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText("卵", egx - 4, egy + 4);

    x += panelW + gap;
  }
}

function controlLinesFor(sourceId) {
  if (sourceId === "kb0") return ["移動: A / D", "ジャンプ: W", "急降下/すり抜け: S", "攻撃: F（長押し2秒で必殺技）", "ガード（卵）: G"];
  if (sourceId === "kb1") return ["移動: ← / →", "ジャンプ: ↑", "急降下/すり抜け: ↓", "攻撃: ,（長押し2秒で必殺技）", "ガード（卵）: .（ピリオド）"];
  return ["移動: スティック/十字", "ジャンプ: A (×)", "急降下/すり抜け: 下", "攻撃: X（長押し2秒で必殺技）", "ガード（卵）: L / R"];
}

// カード表示用の内容（ローカル: 入力ソース別 / オンライン: 自分・相手）
function cardInfoFor(p) {
  if (APP.mode === "online") {
    const my = NET.isHost ? 0 : 1;
    if (p.slot === my) {
      return { label: "あなた", lines: ["移動: A/D または ←/→", "ジャンプ: W / ↑", "急降下/すり抜け: S / ↓", "攻撃: F / ,（長押し2秒で必殺技）", "ガード（卵）: G / .（パッドL/R）"] };
    }
    return { label: "相手（オンライン）", lines: ["リモートプレイヤー", "", "", "", ""] };
  }
  const src = APP.slots[p.slot].source;
  return { label: src.label, lines: controlLinesFor(src.id) };
}

// 参加中プレイヤーそれぞれの操作方法カード（カウントダウン中に表示）
function drawControlCards(m, topY) {
  const n = m.players.length;
  const cardW = 272, cardH = 200, gap = 20;
  const totalW = n * cardW + (n - 1) * gap;
  let x = (W - totalW) / 2;
  for (const p of m.players) {
    const info = cardInfoFor(p);
    ctx.fillStyle = "rgba(12,12,26,0.88)";
    roundRect(x, topY, cardW, cardH, 12);
    ctx.fill();
    ctx.strokeStyle = COLORS[p.slot];
    ctx.lineWidth = 3;
    roundRect(x, topY, cardW, cardH, 12);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.fillStyle = COLORS[p.slot];
    ctx.font = "bold 20px sans-serif";
    ctx.fillText(NAMES[p.slot], x + 16, topY + 30);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "12px sans-serif";
    ctx.fillText(info.label, x + 60, topY + 30);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    info.lines.forEach((t, i) => {
      ctx.fillText(t, x + 16, topY + 62 + i * 26);
    });
    x += cardW + gap;
  }
}

function drawMatch() {
  const m = APP.match;
  ctx.save();
  if (fx.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
  }
  drawBackground(m.stage);
  drawStage(m.platforms, m.stage.theme);
  if (m.walls.length) drawWalls(m.walls, m.groundY, m.stage.theme);
  for (const it of m.items) drawItem(it);
  for (const p of m.players) drawPlayer(p);

  // パーティクル
  for (const pt of fx.particles) {
    ctx.globalAlpha = Math.min(1, pt.life / 12);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (fx.koFlash > 0) {
    ctx.fillStyle = "rgba(255,255,255," + fx.koFlash / 30 + ")";
    ctx.fillRect(0, 0, W, H);
  }

  drawHUD(m);

  // 試合中: H長押しで操作確認、右上に常時ヒント
  if (m.countdown === 0 && !m.ending) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = "13px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(APP.mode === "online" ? "H長押し: 操作確認 ／ Esc: 退出" : "H長押し: 操作確認 ／ Esc: ロビーへ", W - 16, 24);
    if (keys.has("KeyH")) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, W, H);
      drawControlCards(m, 200);
    }
  }

  // オンライン: 相手の入力待ちが続いたら表示
  if (APP.mode === "online" && NET.stall > 30) {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 34px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("相手の通信待ち…", W / 2, H / 2);
  }

  // カウントダウン（+ ステージ名 + 各プレイヤーの操作方法カード）
  if (m.countdown > 0) {
    const sec = Math.ceil(m.countdown / 60);
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffd34d";
    ctx.font = "bold 26px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("STAGE: " + m.stage.name, W / 2, 68);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 120px sans-serif";
    ctx.fillText(String(sec), W / 2, 180);
    drawControlCards(m, 260);
  } else if (m.countdown === 0 && m.tick < COUNTDOWN_TICKS + 50 && !m.ending) {
    ctx.fillStyle = "#ffd34d";
    ctx.font = "bold 110px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GO!", W / 2, H / 2 + 30);
  }

  if (m.ending) {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 90px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("決着！", W / 2, H / 2 + 20);
  }
}

function drawLobby() {
  const selStage = STAGES[APP.stageIndex];
  drawBackground(selStage);
  drawStage(selStage.platforms, selStage.theme);   // 選択中ステージを背景にプレビュー
  if (selStage.walls) {                             // 壁は左上・右下のプレビュー
    const snap = wallSnapshot(selStage, 0.75);
    drawWalls(snap.walls, snap.groundY, selStage.theme);
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 64px sans-serif";
  ctx.fillText("ウチスマ！", W / 2, 120);
  ctx.font = "bold 22px sans-serif";
  ctx.fillStyle = "#ffd34d";
  ctx.fillText("β版 — 身内スマッシュ", W / 2, 158);

  // スロット表示
  const slotW = 250, gap = 24;
  const totalW = MAX_PLAYERS * slotW + (MAX_PLAYERS - 1) * gap;
  let x = (W - totalW) / 2;
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const s = APP.slots[i];
    ctx.fillStyle = s ? "rgba(20,20,40,0.85)" : "rgba(20,20,40,0.45)";
    roundRect(x, 210, slotW, 120, 12);
    ctx.fill();
    ctx.strokeStyle = s ? COLORS[i] : "rgba(255,255,255,0.2)";
    ctx.lineWidth = 3;
    roundRect(x, 210, slotW, 120, 12);
    ctx.stroke();

    ctx.fillStyle = s ? COLORS[i] : "rgba(255,255,255,0.4)";
    ctx.font = "bold 26px sans-serif";
    ctx.fillText(NAMES[i], x + slotW / 2, 252);
    ctx.font = "15px sans-serif";
    ctx.fillStyle = s ? "#fff" : "rgba(255,255,255,0.4)";
    ctx.fillText(s ? s.source.label : "待機中…", x + slotW / 2, 285);
    if (s) {
      ctx.fillStyle = "#7f7";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("参加OK!", x + slotW / 2, 312);
    }
    x += slotW + gap;
  }

  ctx.fillStyle = "#fff";
  ctx.font = "17px sans-serif";
  const lines = [
    "【参加方法】 攻撃ボタンを押すと参加",
    "キーボード左: WASD移動 / W=ジャンプ / S=急降下 / F=攻撃 / G=ガード(卵)",
    "キーボード右: 矢印移動 / ↑=ジャンプ / ↓=急降下 / ,=攻撃 / .=ガード(卵)",
    "ゲームパッド: 移動 / A=ジャンプ / X=攻撃 / L・R=ガード",
    "★攻撃を2秒長押しで必殺技（ガードを一撃で割る）。卵は使い切ると割れて復活まで無し",
    "★アイテムが空から落下！先に触れた人がゲット（🟠リーチ延長5秒／🔵移動＆ジャンプ1.5倍10秒）",
  ];
  lines.forEach((t, i) => ctx.fillText(t, W / 2, 380 + i * 26));

  const joined = APP.slots.filter(Boolean).length;
  ctx.font = "bold 26px sans-serif";
  if (joined >= 2) {
    if (Math.floor(performance.now() / 400) % 2 === 0) {
      ctx.fillStyle = "#ffd34d";
      ctx.fillText("Enter / Start で開始！", W / 2, 540);
    }
  } else {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.fillText("2人以上そろうと開始できます", W / 2, 540);
  }

  // ステージ選択（左右キーで変更）
  ctx.font = "bold 22px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText("◀  ステージ: " + selStage.name + "  （" + (APP.stageIndex + 1) + "/" + STAGES.length + "）  ▶", W / 2, 588);
  ctx.font = "13px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillText("← → （移動キー左右）でステージ変更", W / 2, 610);

  ctx.font = "bold 20px sans-serif";
  ctx.fillStyle = "#8fd3ff";
  ctx.fillText("O キー: オンライン対戦（2人・β）", W / 2, 640);

  const pads = navigator.getGamepads();
  let padCount = 0;
  for (let i = 0; i < pads.length; i++) if (pads[i]) padCount++;
  ctx.font = "14px sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillText("接続中のゲームパッド: " + padCount + "台（ボタンを押すと認識されます）", W / 2, 700);
}

function drawResult() {
  const rStage = APP.match ? APP.match.stage : STAGES[APP.stageIndex];
  const rPlats = APP.match ? APP.match.platforms : rStage.platforms;
  drawBackground(rStage);
  drawStage(rPlats, rStage.theme);
  if (APP.match && APP.match.walls.length) drawWalls(APP.match.walls, APP.match.groundY, rStage.theme);
  else if (!APP.match && rStage.walls) { const s = wallSnapshot(rStage, 0.75); drawWalls(s.walls, s.groundY, rStage.theme); }
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const ws = APP.resultInfo.winnerSlot;
  if (ws !== null) {
    ctx.fillStyle = COLORS[ws];
    ctx.font = "bold 96px sans-serif";
    ctx.fillText(NAMES[ws] + " の勝ち！", W / 2, H / 2 - 30);
  } else {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 96px sans-serif";
    ctx.fillText("引き分け！", W / 2, H / 2 - 30);
  }
  ctx.fillStyle = "#fff";
  ctx.font = "bold 26px sans-serif";
  if (APP.mode === "online") {
    ctx.fillText(NET.isHost ? "Enter: 再戦 ／ Esc: 退出" : "ホストの再戦待ち… ／ Esc: 退出", W / 2, H / 2 + 60);
  } else {
    ctx.fillText("Enter / Start でロビーに戻る", W / 2, H / 2 + 60);
  }
}

/* ==================== メインループ ==================== */

function runTick() {
  if (APP.phase === "lobby") updateLobby();
  else if (APP.phase === "match") updateMatch();
  else if (APP.phase === "result") updateResult();
  updateFx();
}

function renderNow() {
  if (APP.phase === "lobby") drawLobby();
  else if (APP.phase === "match") drawMatch();
  else if (APP.phase === "result") drawResult();
}

let last = performance.now();
let acc = 0;

function frame(now) {
  acc += now - last;
  last = now;
  if (acc > 250) acc = 250;   // タブ復帰時の暴走防止

  while (acc >= TICK_MS) {
    runTick();
    acc -= TICK_MS;
  }
  renderNow();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// デバッグ/テスト用API（決定論的simを外から直接駆動できる）
window.UCHI = {
  APP, keys, runTick, renderNow,
  makeMatchState, stepMatch, makePlayer,
  PHYS, ATTACK, SPECIAL, GUARD, STAGES, BLAST, STOCKS, ITEM, rngNext,
  NET, netHost, netJoin, netHostStart, encodeSample, decodeSample,
};
</script>
